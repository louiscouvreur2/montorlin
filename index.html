<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chez nous — Le refuge de la famille</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest: #1a2e1a;
      --forest-dark: #0d1a0d;
      --forest-light: #2d4a2d;
      --moss: #4a6b3a;
      --moss-light: #5a7c4a;
      --cream: #f5f0e1;
      --cream-dark: #e8e0cc;
      --gold: #d4a843;
      --gold-light: #e8c06a;
      --gold-dark: #b89038;
      --white: #faf8f3;
      --text: #1a2e1a;
      --text-light: #3d5a3d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --forest: #0f1a0f;
        --forest-dark: #081008;
        --forest-light: #1a2a1a;
        --moss: #3a5a2a;
        --moss-light: #4a6a3a;
        --cream: #1a2e1a;
        --cream-dark: #2d4a2d;
        --gold: #c49833;
        --gold-light: #d8b05a;
        --gold-dark: #a88028;
        --white: #e8e0d0;
        --text: #e8e0d0;
        --text-light: #c8d0c8;
      }
    }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--forest);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: var(--white);
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(74, 107, 58, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212, 168, 67, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .mountains {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40vh;
      min-height: 200px;
      max-height: 300px;
      pointer-events: none;
      z-index: 1;
    }
    .mountain {
      position: absolute;
      bottom: 0;
      border-style: solid;
      border-bottom: 0;
    }
    .mountain-1 { left: -10%; width: 0; height: 0; border-left: 60vw solid transparent; border-right: 60vw solid transparent; border-top: 35vh solid var(--forest-dark); opacity: 0.6; }
    .mountain-2 { left: 15%; width: 0; height: 0; border-left: 45vw solid transparent; border-right: 45vw solid transparent; border-top: 28vh solid var(--forest); opacity: 0.8; }
    .mountain-3 { right: -5%; width: 0; height: 0; border-left: 50vw solid transparent; border-right: 50vw solid transparent; border-top: 32vh solid var(--forest-dark); opacity: 0.5; }
    .mountain-4 { right: 20%; width: 0; height: 0; border-left: 35vw solid transparent; border-right: 35vw solid transparent; border-top: 22vh solid var(--forest); opacity: 0.7; }
    .moon {
      position: fixed;
      top: 8%;
      right: 12%;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f5f0e1 0%, #e8dcc0 40%, #d4c4a0 100%);
      box-shadow: 
        0 0 40px rgba(212, 168, 67, 0.4),
        0 0 80px rgba(212, 168, 67, 0.2),
        inset -5px -5px 20px rgba(0,0,0,0.1);
      pointer-events: none;
      z-index: 1;
      animation: moonGlow 4s ease-in-out infinite alternate;
    }
    @keyframes moonGlow {
      0% { box-shadow: 0 0 40px rgba(212, 168, 67, 0.4), 0 0 80px rgba(212, 168, 67, 0.2), inset -5px -5px 20px rgba(0,0,0,0.1); }
      100% { box-shadow: 0 0 60px rgba(212, 168, 67, 0.6), 0 0 120px rgba(212, 168, 67, 0.3), inset -5px -5px 20px rgba(0,0,0,0.1); }
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image: 
        radial-gradient(1px 1px at 10% 20%, #fff, transparent),
        radial-gradient(1px 1px at 30% 40%, #fff, transparent),
        radial-gradient(1px 1px at 50% 15%, #fff, transparent),
        radial-gradient(1px 1px at 70% 30%, #fff, transparent),
        radial-gradient(1px 1px at 90% 25%, #fff, transparent),
        radial-gradient(1px 1px at 20% 60%, #fff, transparent),
        radial-gradient(1px 1px at 80% 50%, #fff, transparent),
        radial-gradient(1px 1px at 40% 70%, #fff, transparent),
        radial-gradient(1px 1px at 60% 80%, #fff, transparent),
        radial-gradient(1px 1px at 15% 85%, #fff, transparent);
      background-repeat: repeat;
      background-size: 400px 400px;
      opacity: 0.3;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; }
      100% { opacity: 0.5; }
    }
    .login-card {
      position: relative;
      z-index: 10;
      background: linear-gradient(145deg, rgba(26, 46, 26, 0.95), rgba(13, 26, 13, 0.98));
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(74, 107, 58, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
    }
    .logo {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 8px 32px rgba(212, 168, 67, 0.4),
        0 0 0 2px rgba(212, 168, 67, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }
    .logo-icon svg { width: 36px; height: 36px; color: var(--forest-dark); }
    h1 { font-size: 2.2rem; font-weight: 400; letter-spacing: 0.05em; color: var(--cream); margin-bottom: 0.25rem; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .subtitle { color: var(--moss-light); font-size: 1.1rem; font-style: italic; font-weight: 300; opacity: 0.9; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--moss-light); margin-bottom: 0.5rem; opacity: 0.8; }
    input {
      width: 100%;
      padding: 1rem 1.25rem;
      background: rgba(13, 26, 13, 0.8);
      border: 2px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      color: var(--cream);
      font-family: inherit;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      outline: none;
    }
    input::placeholder { color: rgba(200, 220, 200, 0.4); }
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.15), 0 0 20px rgba(212, 168, 67, 0.1);
      background: rgba(13, 26, 13, 0.95);
    }
    input:not(:placeholder-shown) { border-color: var(--moss-light); }
    .btn {
      width: 100%;
      padding: 1.1rem 2rem;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      background-size: 200% 100%;
      transition: background-position 0.4s ease;
    }
    .btn span { position: relative; z-index: 1; color: var(--forest-dark); }
    .btn:hover::before { background-position: 200% 0; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:disabled::before { background-position: 0 0; }
    .error-message {
      display: none;
      text-align: center;
      padding: 0.875rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .error-message.show { display: block; }
    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--moss);
      opacity: 0.6;
    }
    .footer-note a { color: var(--gold-light); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .login-card { padding: 2rem 1.5rem; border-radius: 20px; }
      h1 { font-size: 1.8rem; }
      .logo-icon { width: 64px; height: 64px; }
      .logo-icon svg { width: 32px; height: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="mountains" aria-hidden="true">
    <div class="mountain mountain-1"></div>
    <div class="mountain mountain-2"></div>
    <div class="mountain mountain-3"></div>
    <div class="mountain mountain-4"></div>
  </div>
  <div class="moon" aria-hidden="true"></div>

  <main class="login-card" role="main">
    <header class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h1>Chez nous</h1>
      <p class="subtitle">Le refuge de la famille</p>
    </header>

    <div class="error-message" id="errorMsg" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="prenom">TON PRÉNOM</label>
        <input type="text" id="prenom" name="prenom" autocomplete="given-name" placeholder="Ton prénom" required aria-required="true" aria-describedby="prenom-hint">
      </div>
      <div class="form-group">
        <label for="password">MOT DE PASSE</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Celui de la famille" required aria-required="true" aria-describedby="password-hint">
      </div>
      <button type="submit" class="btn" id="submitBtn"><span>Entrer</span></button>
    </form>

    <p class="footer-note">Mot de passe partagé par toute la famille · Données locales uniquement</p>
  </main>

  <script>
    // Shared family password (simple, no backend)
    const FAMILY_PASSWORD = "refuge2026";
    const FAMILY_MEMBERS = ["Léa", "Thomas", "Marie", "Antoine", "Papa", "Maman"];

    const form = document.getElementById('loginForm');
    const prenomInput = document.getElementById('prenom');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    // Check if already logged in (sessionStorage for this session)
    if (sessionStorage.getItem('chez-nous-user')) {
      redirectToApp();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const prenom = prenomInput.value.trim();
      const password = passwordInput.value;

      // Reset error
      errorMsg.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Vérification...';

      // Simulate brief check
      await new Promise(r => setTimeout(r, 600));

      // Validate password
      if (password !== FAMILY_PASSWORD) {
        showError("Ce n'est pas le bon mot de passe familial.");
        resetButton();
        return;
      }

      // Validate name (optional: check against known family)
      if (!prenom) {
        showError("Entre ton prénom.");
        resetButton();
        return;
      }

      // Success - store in sessionStorage
      sessionStorage.setItem('chez-nous-user', JSON.stringify({
        prenom,
        loginTime: Date.now()
      }));

      // Brief success feedback
      submitBtn.querySelector('span').textContent = 'Bienvenue...';
      submitBtn.style.background = 'linear-gradient(90deg, #22c55e, #4ade80)';
      
      setTimeout(() => {
        redirectToApp();
      }, 800);
    });

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
      prenomInput.style.borderColor = 'rgba(239, 68, 68, 0.5)';
      passwordInput.style.borderColor = 'rgba(239, 68, 68, 0.5)';
      setTimeout(() => {
        prenomInput.style.borderColor = '';
        passwordInput.style.borderColor = '';
      }, 3000);
    }

    function resetButton() {
      submitBtn.disabled = false;
      submitBtn.querySelector('span').textContent = 'Entrer';
      submitBtn.style.background = '';
    }

    function redirectToApp() {
      // For now, just show success state (later: redirect to actual app)
      document.body.innerHTML = `
        <div class="stars" aria-hidden="true"></div>
        <div class="mountains" aria-hidden="true">
          <div class="mountain mountain-1"></div>
          <div class="mountain mountain-2"></div>
          <div class="mountain mountain-3"></div>
          <div class="mountain mountain-4"></div>
        </div>
        <div class="moon" aria-hidden="true"></div>
        <main class="login-card" style="text-align: center; padding: 4rem 2.5rem;">
          <div class="logo-icon" style="margin: 0 auto 1.5rem; width: 80px; height: 80px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#1a2e1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="40" height="40">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Bienvenue ${JSON.parse(sessionStorage.getItem('chez-nous-user') || '{}').prenom || 'famille'} 👋</h1>
          <p style="color: var(--moss-light); font-size: 1.2rem; margin-bottom: 2rem;">Tu es maintenant connecté au refuge familial.</p>
          <button class="btn" onclick="sessionStorage.clear(); location.reload();" style="max-width: 200px; margin: 0 auto;"><span>Déconnexion</span></button>
        </main>
        <div class="stars" aria-hidden="true"></div>
        <div class="mountains" aria-hidden="true">
          <div class="mountain mountain-1"></div>
          <div class="mountain mountain-2"></div>
          <div class="mountain mountain-3"></div>
          <div class="mountain mountain-4"></div>
        </div>
        <div class="moon" aria-hidden="true"></div>
      `;
    }

    // Enter key on inputs submits
    [prenomInput, passwordInput].forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
      });
    });

    // Focus first input
    prenomInput.focus();
  </script>
</body>
</html>
