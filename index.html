<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a2e1a">
  <meta name="description" content="Montorlin - Calendrier et album familial">
  <title>Montorlin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest: #1a2e1a;
      --forest-dark: #0d1a0d;
      --forest-light: #2d4a2d;
      --moss: #4a6b3a;
      --moss-light: #5a7c4a;
      --cream: #f5f0e1;
      --cream-dark: #e8e0cc;
      --cream-muted: #c8c0b0;
      --copper: #c8966a;
      --copper-light: #d8a87a;
      --gold: #d4a843;
      --gold-light: #e8c06a;
      --gold-dark: #b89038;
      --white: #faf8f3;
      --text: #1a2e1a;
      --text-light: #3d5a3d;
      --reservation-colors: #e8c06a, #6ab8e8, #e87a6a, #8ae8a0, #d88ae8, #e8b06a;
      --touch-target: 44px;
      --header-height: 56px;
      --tab-bar-height: 60px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --forest: #0f1a0f;
        --forest-dark: #081008;
        --forest-light: #1a2a1a;
        --moss: #3a5a2a;
        --moss-light: #4a6a3a;
        --cream: #f5f0e1;
        --cream-dark: #e8e0cc;
        --cream-muted: #a8a090;
        --copper: #b8865a;
        --copper-light: #c8986a;
        --gold: #c49833;
        --gold-light: #d8b05a;
        --gold-dark: #a88028;
        --white: #e8e0d0;
        --text: #e8e0d0;
        --text-light: #c8d0c8;
      }
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--forest);
      min-height: 100vh;
      color: var(--cream);
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'tnum' 1, 'lnum' 0;
      padding: 0 env(safe-area-inset-left) 0 env(safe-area-inset-right);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(74, 107, 58, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212, 168, 67, 0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .mountains {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40vh;
      min-height: 200px;
      max-height: 300px;
      pointer-events: none;
      z-index: 1;
    }
    .mountain {
      position: absolute;
      bottom: 0;
      border-style: solid;
      border-bottom: 0;
    }
    .mountain-1 { left: -10%; width: 0; height: 0; border-left: 60vw solid transparent; border-right: 60vw solid transparent; border-top: 35vh solid var(--forest-dark); opacity: 0.6; }
    .mountain-2 { left: 15%; width: 0; height: 0; border-left: 45vw solid transparent; border-right: 45vw solid transparent; border-top: 28vh solid var(--forest); opacity: 0.8; }
    .mountain-3 { right: -5%; width: 0; height: 0; border-left: 50vw solid transparent; border-right: 50vw solid transparent; border-top: 32vh solid var(--forest-dark); opacity: 0.5; }
    .mountain-4 { right: 20%; width: 0; height: 0; border-left: 35vw solid transparent; border-right: 35vw solid transparent; border-top: 22vh solid var(--forest); opacity: 0.7; }
    .moon {
      position: fixed;
      top: 8%;
      right: 12%;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f5f0e1 0%, #e8dcc0 40%, #d4c4a0 100%);
      box-shadow:
        0 0 40px rgba(212, 168, 67, 0.4),
        0 0 80px rgba(212, 168, 67, 0.2),
        inset -5px -5px 20px rgba(0,0,0,0.1);
      pointer-events: none;
      z-index: 1;
      animation: moonGlow 4s ease-in-out infinite alternate;
    }
    @keyframes moonGlow {
      0% { box-shadow: 0 0 40px rgba(212, 168, 67, 0.4), 0 0 80px rgba(212, 168, 67, 0.2), inset -5px -5px 20px rgba(0,0,0,0.1); }
      100% { box-shadow: 0 0 60px rgba(212, 168, 67, 0.6), 0 0 120px rgba(212, 168, 67, 0.3), inset -5px -5px 20px rgba(0,0,0,0.1); }
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #fff, transparent),
        radial-gradient(1px 1px at 30% 40%, #fff, transparent),
        radial-gradient(1px 1px at 50% 15%, #fff, transparent),
        radial-gradient(1px 1px at 70% 30%, #fff, transparent),
        radial-gradient(1px 1px at 90% 25%, #fff, transparent),
        radial-gradient(1px 1px at 20% 60%, #fff, transparent),
        radial-gradient(1px 1px at 80% 50%, #fff, transparent),
        radial-gradient(1px 1px at 40% 70%, #fff, transparent),
        radial-gradient(1px 1px at 60% 80%, #fff, transparent),
        radial-gradient(1px 1px at 15% 85%, #fff, transparent);
      background-repeat: repeat;
      background-size: 400px 400px;
      opacity: 0.4;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 0.5; }
    }
    .card {
      position: relative;
      z-index: 10;
      background: linear-gradient(145deg, rgba(26, 46, 26, 0.95), rgba(13, 26, 13, 0.98));
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 24px;
      padding: 1.5rem;
      width: 100%;
      max-width: 1000px;
      margin: 0.75rem auto;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(74, 107, 58, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
    }

    /* Mobile: ensure card has proper side margins and doesn't overflow */
    @media (max-width: 479px) {
      .card {
        margin: 0.5rem auto;
        border-radius: 20px;
        padding: 1rem;
      }
    }
    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 0.75rem;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 32px rgba(212, 168, 67, 0.4),
        0 0 0 2px rgba(212, 168, 67, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }
    .logo-icon svg { width: 32px; height: 32px; color: var(--forest-dark); }
    h1 { font-size: 1.8rem; font-weight: 400; letter-spacing: 0.05em; color: var(--cream); margin-bottom: 0.25rem; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    h2 { font-size: 1.3rem; font-weight: 400; color: var(--cream); margin-bottom: 0.75rem; }
    h3 { font-size: 1.1rem; font-weight: 500; color: var(--cream); margin-bottom: 0.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 0.4rem;
      opacity: 1;
      font-family: system-ui, -apple-system, sans-serif;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(13, 26, 13, 0.8);
      border: 2px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      color: var(--cream);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
      min-height: var(--touch-target);
    }
    input::placeholder, textarea::placeholder { color: rgba(200, 220, 200, 0.5); }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.15), 0 0 20px rgba(212, 168, 67, 0.1);
      background: rgba(13, 26, 13, 0.95);
    }
    input:not(:placeholder-shown), select:not([value=""]) { border-color: var(--cream); }
    .btn {
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      min-height: var(--touch-target);
      min-width: var(--touch-target);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      background-size: 200% 100%;
      transition: background-position 0.4s ease;
    }
    .btn span { position: relative; z-index: 1; color: var(--forest-dark); }
    .btn:hover::before { background-position: 200% 0; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:disabled::before { background-position: 0 0; }
    .btn-secondary { background: var(--forest-light); color: var(--cream); }
    .btn-secondary::before { background: linear-gradient(90deg, var(--moss) 0%, var(--moss-light) 100%); }
    .btn-danger { background: var(--forest-light); color: #e87a6a; }
    .btn-danger::before { background: linear-gradient(90deg, #c85a4a 0%, #e87a6a 100%); }
    .btn-copper { background: var(--forest-light); color: var(--copper-light); }
    .btn-copper::before { background: linear-gradient(90deg, var(--copper) 0%, var(--copper-light) 100%); }
    .btn-icon {
      padding: 0.625rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon svg {
      position: relative;
      z-index: 1;
    }
    .error-message {
      display: none;
      text-align: center;
      padding: 0.875rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .error-message.show { display: block; }

    /* App Header - Compact Mobile First */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, rgba(26, 46, 26, 0.95), rgba(13, 26, 13, 0.8));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(74, 107, 58, 0.2);
      padding: 0.5rem 0.75rem;
      margin: -0.75rem -0.75rem 0.75rem;
      border-radius: 24px 24px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      height: var(--header-height);
      flex-wrap: wrap;
    }
    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      flex-shrink: 0;
    }
    .sync-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.5rem;
      background: rgba(74, 107, 58, 0.15);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 999px;
      font-size: 0.6rem;
      font-weight: 500;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sync-indicator .dot {
      width: 5px; height: 5px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .sync-indicator.syncing .dot { background: #f59e0b; animation: none; }
    .sync-indicator.error .dot { background: #ef4444; animation: none; }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--forest-dark);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .user-avatar:hover { transform: scale(1.05); }
    .header-btn {
      padding: 0.375rem 0.625rem;
      font-size: 0.7rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Bottom Tab Bar - Fixed */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: linear-gradient(180deg, rgba(13, 26, 13, 0.95), rgba(26, 46, 26, 0.98));
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(74, 107, 58, 0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: var(--tab-bar-height);
      padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      max-width: 100vw;
      overflow-x: hidden;
    }
    .tab-bar-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.125rem;
      padding: 0.5rem 0.75rem;
      background: transparent;
      border: none;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: var(--touch-target);
      min-width: var(--touch-target);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .tab-bar-btn .icon {
      font-size: 1.25rem;
      line-height: 1;
    }
    .tab-bar-btn:hover { color: var(--gold-light); }
    .tab-bar-btn.active {
      color: var(--gold);
      transform: translateY(-2px);
    }
    .tab-bar-btn.active .icon { color: var(--gold); }
    .tab-content {
      animation: fadeIn 0.2s ease;
      padding-bottom: calc(var(--tab-bar-height) + 1rem);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Calendar Styles */
    .calendar-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .calendar-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding: 0 0.25rem;
    }
    .calendar-header-title { font-size: 1.1rem; color: var(--cream); margin: 0; }
    .next-reservation-banner {
      background: linear-gradient(90deg, var(--copper) 0%, var(--copper-light) 100%);
      color: var(--forest-dark);
      padding: 0.375rem 0.75rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .calendar-nav {
      display: flex;
      gap: 0.375rem;
    }
    .calendar-nav-btn {
      width: var(--touch-target);
      height: var(--touch-target);
      border-radius: 10px;
      background: var(--forest-light);
      border: 1px solid rgba(74, 107, 58, 0.3);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
      line-height: 1;
    }
    .calendar-nav-btn:hover {
      background: var(--forest);
      border-color: var(--gold);
      color: var(--gold);
    }
    .calendar-nav-btn:active { transform: scale(0.95); }
    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 6px;
      padding: 0 3px;
    }
    .calendar-day-name {
      text-align: center;
      padding: 0.5rem 0;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gold-light);
      opacity: 0.9;
      font-family: system-ui, -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .calendar-day {
      aspect-ratio: 1;
      min-height: 0;
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 10px;
      padding: 0.375rem;
      position: relative;
      transition: all 0.2s ease;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .calendar-day:hover {
      background: rgba(13, 26, 13, 0.9);
      border-color: var(--gold);
    }
    .calendar-day.other-month { opacity: 0.25; }
    .calendar-day.today {
      border-color: var(--gold);
      box-shadow: inset 0 0 0 2px var(--gold);
      background: rgba(212, 168, 67, 0.08);
    }
    .calendar-day.today::before {
      content: '';
      position: absolute;
      top: 3px; right: 3px;
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
    }
    .day-number {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 0.25rem;
      line-height: 1.2;
      font-family: system-ui, -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .calendar-day.other-month .day-number { color: var(--cream-dark); }
    .reservations-list { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow: hidden; }
    .reservation-chip {
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.55rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: transform 0.15s ease;
      border: 1px solid transparent;
      min-height: 24px;
      display: flex;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .reservation-chip:hover { transform: scale(1.02); z-index: 10; border-color: rgba(255,255,255,0.3); }
    .more-reservations {
      font-size: 0.5rem;
      color: var(--cream-muted);
      text-align: center;
      padding: 1px;
      opacity: 0.7;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: linear-gradient(145deg, rgba(26, 46, 26, 0.98), rgba(13, 26, 13, 0.99));
      border: 1px solid rgba(74, 107, 58, 0.4);
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-title { font-size: 1.3rem; color: var(--cream); margin: 0; }
    .modal-close {
      background: none; border: none; color: var(--cream); font-size: 1.5rem; cursor: pointer; padding: 0.5rem;
      opacity: 0.7; transition: opacity 0.2s; min-width: var(--touch-target); min-height: var(--touch-target);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { opacity: 1; color: var(--gold); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .modal .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: clamp(1rem, 4vw, 1.5rem);
      align-items: start;
      padding: 0 0.5rem;
      justify-content: center;
    }
    .modal .form-row .form-group { min-width: 0; }
    textarea { min-height: 90px; resize: vertical; font-family: inherit; }

    .reservation-detail {
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .reservation-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .reservation-detail-title { font-size: 1.1rem; color: var(--cream); font-weight: 500; margin: 0; }
    .reservation-detail-meta { display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.8rem; color: var(--cream); }
    .reservation-detail-dates { display: flex; gap: 1rem; font-size: 0.75rem; }

    .reservations-panel {

      padding: 0.875rem;
      background: rgba(13, 26, 13, 0.6);

    .reservation-item-meta { display: flex; gap: 1rem; font-size: 0.7rem; color: var(--cream); flex-wrap: wrap; }
    .reservation-item-actions { display: flex; gap: 0.375rem; }
    .reservation-item-actions .btn { padding: 0.5rem 0.875rem; font-size: 0.75rem; }

    .color-legend { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(74, 107, 58, 0.2); }
    .color-legend-item { display: flex; align-items: center; gap: 0.375rem; font-size: 0.7rem; color: var(--cream); }
    .color-legend-dot { width: 10px; height: 10px; border-radius: 3px; }

    /* ALBUM STYLES */
    .album-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .album-header h3 { margin: 0; font-size: 1.1rem; }
    .album-tabs {
      display: flex;
      gap: 0.375rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .album-tab-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex: 0 0 auto;
      scroll-snap-align: start;
    }
    .album-tab-btn {
      scroll-snap-align: start;
      padding: 0.5rem 0.875rem;
      background: var(--forest-light);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 999px;
      color: var(--cream);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-height: var(--touch-target);
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }
    .album-tab-btn:hover {
      background: var(--forest);
      border-color: var(--gold);
      color: var(--cream);
    }
    .album-tab-btn.active {
      background: linear-gradient(90deg, var(--moss) 0%, var(--moss-light) 100%);
      border-color: var(--moss-light);
      color: var(--forest-dark);
    }
    .album-tab-actions { display: flex; gap: 0.125rem; }
    .album-action-btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--forest);
      border: 1px solid rgba(74, 107, 58, 0.3);
      color: var(--cream);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
    }
    .album-action-btn:hover {
      background: var(--forest-light); border-color: var(--gold); color: var(--gold);
    }
    .album-action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444;
    }
    .album-content { display: none; }
    .album-content.active { display: block; animation: fadeIn 0.2s ease; }
    .album-checkboxes {
      display: flex; flex-direction: column; gap: 0.5rem;
      max-height: 200px; overflow-y: auto;
    }
    .album-checkbox {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem;
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
    }
    .album-checkbox:hover { border-color: var(--gold); background: rgba(212, 168, 67, 0.1); }
    .album-checkbox input[type="checkbox"] {
      width: 20px; height: 20px; accent-color: var(--gold); cursor: pointer;
    }
    .album-checkbox-label { color: var(--cream); font-size: 0.9rem; flex: 1; cursor: pointer; }

    .upload-zone {
      border: 2px dashed rgba(74, 107, 58, 0.4);
      border-radius: 16px;
      padding: 2rem 1rem;
      text-align: center;
      color: var(--cream);
      transition: all 0.2s ease;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--gold);
      background: rgba(212, 168, 67, 0.05);
      color: var(--gold);
    }
    .upload-zone input { display: none; }
    .upload-zone svg { width: 48px; height: 48px; margin-bottom: 0.75rem; opacity: 0.6; }
    .upload-zone p { margin: 0; font-size: 0.85rem; }
    .upload-zone small { opacity: 0.6; font-size: 0.7rem; }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.625rem;
    }
    .album-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--cream-muted);
    }
    .album-empty svg { width: 64px; height: 64px; opacity: 0.4; margin-bottom: 1rem; }
    .photo-card {
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      aspect-ratio: 1;
      transition: all 0.2s ease;
    }
    .photo-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .photo-thumb {
      aspect-ratio: 1;
      width: 100%;
      object-fit: cover;
      background: rgba(13, 26, 13, 0.4);
    }
    .photo-info {
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
      min-height: 48px;
    }
    .photo-title {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--cream);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .photo-meta {
      font-size: 0.55rem;
      color: var(--cream-muted);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .photo-actions {
      display: flex;
      gap: 0.125rem;
      padding: 0.375rem;
      border-top: 1px solid rgba(74, 107, 58, 0.2);
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .photo-card:hover .photo-actions { opacity: 1; }
    .photo-action-btn {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--forest-light);
      border: 1px solid rgba(74, 107, 58, 0.3);
      color: var(--cream);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease; font-size: 0.75rem;
    }
    .photo-action-btn:hover {
      background: var(--forest);
      border-color: var(--gold);
      color: var(--gold);
    }
    .photo-action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
    }

    /* PHOTO MODAL - Fullscreen Lightbox */
    .photo-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .photo-modal-overlay.open { opacity: 1; visibility: visible; }
    .photo-modal {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      width: 100%;
      max-width: none;
      max-height: 100%;
      overflow: hidden;
      box-shadow: none;
      transform: scale(0.95);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .photo-modal-overlay.open .photo-modal { transform: scale(1); }
    .photo-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
    }
    .photo-modal-title { font-size: 1rem; color: var(--cream); margin: 0; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .photo-modal-close {
      background: rgba(255,255,255,0.1); border: none; color: var(--cream); font-size: 1.5rem; cursor: pointer; padding: 0.5rem;
      border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .photo-modal-close:hover { background: rgba(255,255,255,0.2); color: var(--gold); }
    .photo-modal-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
      position: relative;
    }
    .photo-modal-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
      touch-action: pan-y pinch-zoom;
    }
    .photo-modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--cream);
      font-size: 1.5rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }
    .photo-modal-nav:hover { background: rgba(255,255,255,0.2); color: var(--gold); }
    .photo-modal-nav.prev { left: 1rem; }
    .photo-modal-nav.next { right: 1rem; }
    .photo-modal-footer {
      padding: 1rem 1.25rem;
      background: linear-gradient(0deg, rgba(0,0,0,0.7), transparent);
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .photo-modal-meta {
      font-size: 0.75rem;
      color: var(--cream-muted);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .photo-modal-form { display: flex; flex-direction: column; gap: 1rem; background: rgba(13, 26, 13, 0.9); padding: 1rem; border-radius: 12px; border: 1px solid rgba(74, 107, 58, 0.3); }
    .photo-modal-form .form-group { margin-bottom: 0; }
    .album-create-form {
      display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;
    }
    .album-create-form input { flex: 1; min-width: 180px; padding: 0.75rem 1rem; }
    .album-create-form .btn { white-space: nowrap; }

    /* Login Page Enhancements */
    .login-card { max-width: 420px; margin: 1rem auto; text-align: center; }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--cream-muted);
    }
    .login-footer a { color: var(--gold-light); text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }
    .password-wrapper { position: relative; }
    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--cream-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: flex; align-items: center; justify-content: center;
      min-width: 32px; min-height: 32px;
    }
    .password-toggle:hover { color: var(--gold); }

    /* Mobile-first responsive */
    @media (min-width: 480px) {
      .card { padding: 2rem; margin: 1rem auto; border-radius: 24px; }
      h1 { font-size: 2.2rem; }
      .logo-icon { width: 72px; height: 72px; }
      .logo-icon svg { width: 36px; height: 36px; }
      .calendar-day { min-height: 100px; padding: 0.5rem; }
      .day-number { font-size: 1.1rem; }
      .form-row { grid-template-columns: 1fr 1fr; }
      .reservation-item { flex-wrap: nowrap; }
      .reservation-item-actions { width: auto; }
      .tab-nav { flex-wrap: nowrap; overflow-x: visible; }
      .tab-btn { flex: 1; text-align: center; }
      .header-actions { gap: 1rem; }
      .app-header h1 { font-size: 1.5rem; }
      .photo-modal-nav.prev { left: 2rem; }
      .photo-modal-nav.next { right: 2rem; }
    }
    @media (min-width: 768px) {
      .calendar-container { overflow-x: visible; }
      .calendar-nav-btn { width: 40px; height: 40px; }
      .tab-bar { display: none; }
      .tab-nav { display: flex; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    /* High contrast for accessibility */
    @media (prefers-contrast: high) {
      :root {
        --cream: #ffffff; --gold: #ffd700; --moss-light: #90ee90;
        --forest: #000000; --forest-dark: #000000; --forest-light: #1a1a1a;
      }
      .calendar-day { border-width: 2px; }
      .btn { border: 2px solid currentColor; }
    }
    /* Focus visible for keyboard navigation */
    *:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    button:focus:not(:focus-visible),
    a:focus:not(:focus-visible),
    input:focus:not(:focus-visible) { outline: none; }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="mountains" aria-hidden="true">
    <div class="mountain mountain-1"></div>
    <div class="mountain mountain-2"></div>
    <div class="mountain mountain-3"></div>
    <div class="mountain mountain-4"></div>
  </div>
  <div class="moon" aria-hidden="true"></div>

  <!-- LOGIN VIEW -->
  <main id="loginView" class="card login-card">
    <header class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h1>Montorlin</h1>
    </header>

    <div class="error-message" id="errorMsg" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="prenom">TON PRÉNOM</label>
        <input type="text" id="prenom" name="prenom" autocomplete="given-name" required aria-required="true" placeholder=" ">
      </div>
      <div class="form-group">
        <label for="password">MOT DE PASSE</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" autocomplete="current-password" required aria-required="true" placeholder=" ">
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Afficher/Masquer le mot de passe">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn" style="width: 100%;" id="submitBtn"><span>Entrer</span></button>
    </form>
    <div class="login-footer">Mot de passe familial</div>
  </main>

  <!-- APP VIEW (hidden initially) -->
  <main id="appView" class="card" style="display: none;">
    <header class="app-header">
      <h1>Montorlin</h1>
      <div class="header-actions">
        <div class="sync-indicator" id="syncIndicator">
          <span class="dot"></span>
          <span id="syncText">Synchronisé</span>
        </div>
        <div class="user-avatar" id="userAvatar" aria-label="Utilisateur connecté" role="button" tabindex="0">?</div>
        <button class="btn btn-secondary header-btn btn-icon" id="logoutBtn" aria-label="Déconnexion" title="Déconnexion">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- TAB NAVIGATION (Desktop) -->
    <nav class="tab-nav" id="tabNav" role="tablist" aria-label="Navigation principale" style="display: none;">
      <button class="tab-btn active" role="tab" aria-selected="true" data-tab="reservations" id="tabReservations">📅 Réservations</button>
      <button class="tab-btn" role="tab" aria-selected="false" data-tab="album" id="tabAlbum">📸 Album</button>
    </nav>

    <!-- TAB RÉSERVATIONS -->
    <div class="tab-content" id="tabContentReservations" role="tabpanel" aria-labelledby="tabReservations">
      <div class="calendar-container">
        <div class="calendar-header-row">
          <h2 class="calendar-header-title" id="calendarTitle"></h2>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div id="nextReservationBanner" class="next-reservation-banner" style="display: none;"></div>
            <div class="calendar-nav">
              <button class="calendar-nav-btn" id="prevMonth" aria-label="Mois précédent" title="Mois précédent">◀</button>
              <button class="calendar-nav-btn" id="nextMonth" aria-label="Mois suivant" title="Mois suivant">▶</button>
            </div>
          </div>
        </div>
        <div class="calendar-header" id="calendarHeader" role="rowheader"></div>
        <div class="calendar-grid" id="calendarGrid" role="grid"></div>
      </div>

      <div class="reservations-panel">
        <h3>Réservations à venir</h3>
        <div class="reservations-list-full" id="reservationsList"></div>
      </div>

      <div class="color-legend" id="colorLegend"></div>
    </div>

    <!-- TAB ALBUM -->
    <div class="tab-content" id="tabContentAlbum" role="tabpanel" aria-labelledby="tabAlbum" style="display: none;">
      <div class="album-header">
        <h3>📸 Album</h3>
        <button class="btn btn-secondary" id="newAlbumBtn" style="min-width: auto;"><span>+ Nouvel album</span></button>
      </div>

      <div class="album-create-form" id="albumCreateForm" style="display: none; margin-bottom: 1rem;">
        <input type="text" id="newAlbumName" placeholder="Nom de l'album" maxlength="50">
        <button class="btn btn-secondary" id="createAlbumBtn"><span>Créer</span></button>
        <button class="btn btn-secondary" id="cancelAlbumBtn"><span>Annuler</span></button>
      </div>

      <div class="album-tabs" id="albumTabs" role="tablist" aria-label="Albums"></div>

      <div class="upload-zone" id="uploadZone">
        <input type="file" id="photoUpload" accept="image/*" multiple>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p>Ajouter des photos</p>
        <small>JPEG, PNG, WebP — compression auto 1920px / 80%</small>
      </div>

      <div class="album-grid" id="albumGrid" role="grid" aria-label="Photos de l'album">
        <div class="album-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="3" width="20" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <p>Aucune photo</p>
        </div>
      </div>
    </div>
  </main>

  <!-- BOTTOM TAB BAR (Mobile) -->
  <nav class="tab-bar" id="bottomTabBar" role="tablist" aria-label="Navigation principale" style="display: none;">
    <button class="tab-bar-btn active" role="tab" aria-selected="true" data-tab="reservations" id="bottomTabReservations">
      <span class="icon">📅</span>
      <span>Réservations</span>
    </button>
    <button class="tab-bar-btn" role="tab" aria-selected="false" data-tab="album" id="bottomTabAlbum">
      <span class="icon">📸</span>
      <span>Album</span>
    </button>
  </nav>

  <!-- MODAL FOR RESERVATION -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <header class="modal-header">
        <h2 class="modal-title" id="modalTitle">Nouvelle réservation</h2>
        <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
      </header>
      <form id="reservationForm">
        <input type="hidden" id="reservationId">
        <div class="form-group">
          <label for="resTitle">Titre</label>
          <input type="text" id="resTitle" placeholder="Titre" required maxlength="100">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="resStart">Arrivée</label>
            <input type="date" id="resStart" required>
          </div>
          <div class="form-group">
            <label for="resEnd">Départ</label>
            <input type="date" id="resEnd" required>
          </div>
        </div>
        <div class="form-group">
          <label for="resColor">Couleur</label>
          <select id="resColor">
            <option value="#e8c06a">🟡 Or</option>
            <option value="#6ab8e8">🔵 Bleu</option>
            <option value="#e87a6a">🔴 Rouge</option>

    // Helper: format date for input
    function formatDateForInput(date) {
      if (typeof date === 'string') return date;

      return date.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });

    function getColorForUser(prenom) {
      const colors = RESERVATION_COLORS.map(c => c.value);
      let hash = 0;
      for (let i = 0; i < prenom.length; i++) hash = prenom.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    // Normalize reservation data - handles both old and new formats
    function normalizeReservation(id, val) {
      return {
        id,
        title: val.title || val.name || '',
        start_date: val.start_date || val.start || val.startDate || '',
        end_date: val.end_date || val.end || val.endDate || '',

    // CALENDAR FUNCTIONS
    function renderCalendarHeader() {
      const headerEl = document.getElementById('calendarHeader');
      if (!headerEl) return;

      headerEl.innerHTML = days.map(d => `<div class="calendar-day-name">${d}</div>`).join('');
    }

    function getMonthDays(year, month) {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDay = (firstDay.getDay() + 6) % 7;
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      const days = [];
      for (let i = startingDay - 1; i >= 0; i--) {
        days.push({ date: new Date(year, month - 1, prevMonthLastDay - i), otherMonth: true });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        days.push({ date: new Date(year, month, d), otherMonth: false });
      }
      const totalCells = Math.ceil((startingDay + daysInMonth) / 7) * 7;
      for (let d = 1; days.length < totalCells; d++) {
        days.push({ date: new Date(year, month + 1, d), otherMonth: true });
      }
      return days;
    }

    function getReservationsForDay(dateStr) {
      return reservations.filter(r => {
        const start = new Date(r.start_date);
        const end = new Date(r.end_date);
        const check = new Date(dateStr);
        return check >= start && check <= end;
      });
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

      const headerTitle = document.getElementById('calendarTitle');
      if (headerTitle) headerTitle.textContent = `${monthNames[month]} ${year}`;

      // Next reservation banner
      const nextRes = [...reservations]
        .filter(r => new Date(r.start_date) >= new Date())
        .sort((a, b) => new Date(a.start_date) - new Date(b.start_date))[0];
      const banner = document.getElementById('nextReservationBanner');
      if (banner) {
        if (nextRes) {
          const daysDiff = Math.ceil((new Date(nextRes.start_date) - new Date()) / (1000 * 60 * 60 * 24));
          banner.textContent = `Prochaine réservation : dans ${daysDiff} jour${daysDiff > 1 ? 's' : ''} — ${nextRes.title}`;
          banner.style.display = 'inline-block';
        } else {
          banner.style.display = 'none';
        }
      }

      const days = getMonthDays(year, month);
      const gridEl = document.getElementById('calendarGrid');
      if (!gridEl) return;

      gridEl.innerHTML = days.map(day => {
        const dateStr = formatDateForInput(day.date);
        const dayReservations = getReservationsForDay(dateStr);
        const isToday = day.date.toDateString() === new Date().toDateString();
        const isOtherMonth = day.otherMonth;

        return `
          <div class="calendar-day ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}" data-date="${dateStr}" role="gridcell" aria-label="${dateStr}${dayReservations.length ? ': ' + dayReservations.map(r => r.title).join(', ') : ''}">
            <div class="day-number">${day.date.getDate()}</div>
            <div class="reservations-list">
              ${dayReservations.slice(0, 3).map(r => `
                <div class="reservation-chip" style="background: ${r.color}; border-color: ${r.color};" data-id="${r.id}" title="${r.title} - ${r.prenom}${r.notes ? ': ' + r.notes : ''}">
                  ${r.title}
                </div>
              `).join('')}
              ${dayReservations.length > 3 ? `<div class="more-reservations">+${dayReservations.length - 3} autres</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.calendar-day:not(.other-month)').forEach(dayEl => {
        dayEl.addEventListener('click', (e) => {
          if (!e.target.closest('.reservation-chip')) {
            openModal(dayEl.dataset.date);
          }
        });
      });

      document.querySelectorAll('.reservation-chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          openModal(null, chip.dataset.id);
        });
      });
    }

    // RESERVATION CRUD - Firebase Realtime Database
    async function loadReservations() {
      console.log("[DEBUG] loadReservations called");
      setSyncStatus('syncing', 'Chargement...');
      try {
        const reservationsQuery = query(reservationsRef, orderByChild('timestamp'), limitToLast(100));
        onValue(reservationsQuery, (snapshot) => {
          console.log("[DEBUG] onValue callback triggered, snapshot:", snapshot.val());
          const data = snapshot.val();
          if (data) {
            reservations = Object.entries(data).map(([id, val]) => normalizeReservation(id, val))
              .sort((a, b) => b.timestamp - a.timestamp);
          } else {
            reservations = [];
          }
          console.log("[DEBUG] Reservations loaded:", reservations);
          renderCalendar();
          renderReservationsList();
          renderColorLegend();
          setSyncStatus('ok', 'Synchronisé');
        }, (error) => {
          console.error('Firebase error:', error);
          setSyncStatus('error', 'Erreur de connexion');
        });
      } catch (error) {
        console.error('Load reservations error:', error);
        setSyncStatus('error', 'Erreur chargement');
      }
    }

    async function saveReservation(e) {
      e.preventDefault();

      const idInput = document.getElementById('reservationId');
      const titleInput = document.getElementById('resTitle');
      const startInput = document.getElementById('resStart');
      const endInput = document.getElementById('resEnd');
      const colorSelect = document.getElementById('resColor');
      const notesInput = document.getElementById('resNotes');
      const errorMsg = document.getElementById('errorMsg');
      const submitTextEl = document.getElementById('modalSubmitText');

      const isEdit = !!idInput?.value;
      const title = titleInput?.value?.trim();
      const start = startInput?.value;
      const end = endInput?.value;
      const color = colorSelect?.value;
      const notes = notesInput?.value?.trim();

      if (!title || !start || !end) {
        showError('Titre, arrivée et départ requis.');
        return;
      }
      if (new Date(end) < new Date(start)) {
        showError('La date de départ doit être après l\'arrivée.');
        return;
      }

      const reservationData = {
        title,
        start_date: start,
        end_date: end,
        color,
        notes,
        prenom: currentUser,
        timestamp: Date.now()
      };

      try {
              setSyncStatus('syncing', isEdit ? 'Mise à jour...' : 'Création...');

              if (isEdit) {
                const resId = document.getElementById('reservationId')?.value;
                await set(ref(db, 'reservations/' + resId), reservationData);
              } else {
                await push(reservationsRef, reservationData);
              }

              closeModal();
              setSyncStatus('ok', 'Synchronisé');
            } catch (error) {
              console.error('Save reservation error:', error);
              showError('Erreur lors de la sauvegarde: ' + error.message);
              setSyncStatus('error', 'Erreur');
            }
          }

          async function deleteReservation(id) {
                showConfirmModal(
                  'Supprimer cette réservation ?',
                  'Cette action est irréversible.',
                  async () => {
                    try {
                      setSyncStatus('syncing', 'Suppression...');
                      await remove(ref(db, 'reservations/' + id));
                      closeModal();
                      setSyncStatus('ok', 'Synchronisé');
                    } catch (error) {
                      console.error('Delete error:', error);
                      showError('Erreur suppression: ' + error.message);
                      setSyncStatus('error', 'Erreur');
                    }
                  }
                );
                              }

                    function showError(message) {
      const errorMsg = document.getElementById('errorMsg');

        errorMsg.textContent = message;
        errorMsg.classList.add('show');

      setTimeout(() => {
        const p = document.getElementById('prenom');
        if (p) p.style.borderColor = '';
        const pw = document.getElementById('password');
        if (pw) pw.style.borderColor = '';
      }, 3000);
    }

    function normalizeAlbum(id, val) {

            createdBy: val.createdBy || currentUser || 'Inconnu'

        function normalizePhoto(id, val) {
          return {
            id,
            title: val.title || val.name || '',
            comment: val.comment || val.description || '',
            dataUrl: val.dataUrl || val.url || '',
            mimeType: val.mimeType || 'image/jpeg',

    async function loadAlbums() {
          console.log('[DEBUG] loadAlbums called');
          setSyncStatus('syncing', 'Chargement albums...');
          try {
            const albumsRef = ref(db, 'albums');
            const albumsQuery = query(albumsRef, orderByKey(), limitToLast(50));
            onValue(albumsQuery, (snapshot) => {
              console.log('[DEBUG] Albums onValue:', snapshot.val());
              const data = snapshot.val();
              if (data) {
                albums = Object.entries(data).map(([id, val]) => normalizeAlbum(id, val))
                  .sort((a, b) => b.createdAt - a.createdAt);
              } else {
                albums = [];
              }
              console.log('[DEBUG] Albums loaded:', albums);
              renderAlbumTabs();
              if (albums.length > 0 && !currentAlbumId) {
                selectAlbum(albums[0].id);
              } else if (currentAlbumId) {
                renderAlbumGrid();
              }
              setSyncStatus('ok', 'Synchronisé');
            }, (error) => {
              console.error('Firebase albums error:', error);
              setSyncStatus('error', 'Erreur albums');
            });
          } catch (error) {
            console.error('Load albums error:', error);
            setSyncStatus('error', 'Erreur chargement albums');
          }

          loadAllPhotos();
        }

        async function loadAllPhotos(reset = false) {
                  console.log('[DEBUG] loadAllPhotos called, reset:', reset);

                  if (reset) {
                    photosPagination.lastKey = null;
                    photosPagination.hasMore = true;
                    allPhotos = {};
                  }

                  if (photosPagination.isLoading || !photosPagination.hasMore) {
                    return;
                  }

                  photosPagination.isLoading = true;

                  try {
                    const photosRef = ref(db, 'photos');
                    let photosQuery;

                    if (photosPagination.lastKey) {
                      photosQuery = query(
                        photosRef,
                        orderByKey(),
                        endBefore(photosPagination.lastKey),
                        limitToLast(photosPagination.batchSize)
                      );
                    } else {
                      photosQuery = query(
                        photosRef,
                        orderByKey(),
                        limitToLast(photosPagination.batchSize)
                      );
                    }

                    const snapshot = await get(photosQuery);
                    console.log('[DEBUG] Photos get:', snapshot.val());

                    if (snapshot.exists()) {
                      const data = snapshot.val();
                      const entries = Object.entries(data).map(([id, val]) => normalizePhoto(id, val))
                        .sort((a, b) => b.createdAt - a.createdAt);

                      if (photosPagination.lastKey && entries.length > photosPagination.batchSize) {
                        entries.pop();
                      }

                      entries.forEach(photo => {
                                              allPhotos[photo.id] = photo;
                                            });

                                            if (entries.length > 0) {
                                              photosPagination.lastKey = entries[entries.length - 1].id;
                                            }

                      photosPagination.hasMore = entries.length >= photosPagination.batchSize;

                      console.log('[DEBUG] Photos loaded:', Object.keys(allPhotos).length, 'hasMore:', photosPagination.hasMore);

                      if (currentAlbumId) {
                        renderAlbumGrid();
                      }
                    } else {
                      photosPagination.hasMore = false;
                    }

                    photosPagination.isLoading = false;

                  } catch (error) {
                    console.error('Load photos error:', error);
                    photosPagination.isLoading = false;
                  }
                }

    function setupInfiniteScroll() {
      const sentinel = document.querySelector('.load-more-sentinel');
      if (!sentinel) return;

      if (infiniteScrollObserver) {
        infiniteScrollObserver.disconnect();
      }

      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && photosPagination.hasMore && !photosPagination.isLoading) {
          loadMorePhotos();
        }
      }, {
        rootMargin: '100px',
        threshold: 0.1
      });

      observer.observe(sentinel);
      infiniteScrollObserver = observer;
    }

    function compressImage(file, maxDimension = 1920, quality = 0.8) {
      console.log(`[COMPRESS] 🗜️ Début: ${file.name} (${file.size} bytes, ${file.type})`);
      const start = Date.now();
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(img.src);
          console.log(`[COMPRESS] 🖼️ Image chargée: ${img.width}x${img.height} en ${Date.now() - start}ms`);
          const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          console.log(`[COMPRESS] 🎨 Canvas: ${canvas.width}x${canvas.height} (scale: ${scale})`);
          canvas.toBlob(blob => {
            console.log(`[COMPRESS] ✅ Blob WebP: ${Math.round(blob.size/1024)} KB en ${Date.now() - start}ms`);
            resolve(blob);
          }, 'image/webp', quality);
        };
        img.onerror = (e) => {
          console.error('[COMPRESS] ❌ Erreur chargement image:', e);
          reject(e);
        };
      });
    }

    function fileToDataUrl(file) {
      console.log(`[BASE64] 📦 Début conversion: ${file.name} (${file.size} bytes)`);
      const start = Date.now();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          console.log(`[BASE64] ✅ Terminé: ${file.name} en ${Date.now() - start}ms (${Math.round(reader.result.length/1024)} KB chars)`);
          resolve(reader.result);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function doDeletePhoto(photoId, deleteFromAll) {
      try {
        setSyncStatus('syncing', 'Suppression...');

        const photo = allPhotos[photoId];
        if (!photo) {
          showError('Photo introuvable');
          return;
        }

        if (deleteFromAll || !photo.albumIds || photo.albumIds.length <= 1) {
          await remove(ref(db, 'photos/' + photoId));
        } else {
          const newAlbumIds = photo.albumIds.filter(id => id !== currentAlbumId);
          await set(ref(db, 'photos/' + photoId + '/albumIds'), newAlbumIds);
        }

        setSyncStatus('ok', 'Photo supprimée');
        closePhotoModal();
        renderAlbumGrid();
      } catch (error) {
        console.error('Delete photo error:', error);
        showError('Erreur suppression: ' + error.message);
        setSyncStatus('error', 'Erreur');
      }
    }

      }

      if (metaEl) {
        const dateStr = photo.createdAt ? new Date(photo.createdAt).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
        metaEl.innerHTML = `
          ${photo.createdBy ? `<span>👤 ${photo.createdBy}</span>` : ''}
          ${dateStr ? `<span>📅 ${dateStr}</span>` : ''}
        `;
      }

      const form = document.getElementById('photoModalForm');
      if (form) form.dataset.photoId = photoId;

      updatePhotoModalNav();
      if (overlay) overlay.classList.add('open');
    }

    function updatePhotoModalNav() {
      const prevBtn = document.getElementById('photoModalPrev');
      const nextBtn = document.getElementById('photoModalNext');
      if (prevBtn) prevBtn.style.display = currentPhotoIndex > 0 ? 'flex' : 'none';
      if (nextBtn) nextBtn.style.display = currentPhotoIndex < currentPhotoIds.length - 1 ? 'flex' : 'none';
    }

    function navigatePhoto(delta) {
      const newIndex = currentPhotoIndex + delta;
      if (newIndex >= 0 && newIndex < currentPhotoIds.length) {
        currentPhotoIndex = newIndex;
        const photoId = currentPhotoIds[currentPhotoIndex];
        const photo = allPhotos[photoId];
        if (!photo) return;

        const imgEl = document.getElementById('photoModalImage');
        const titleEl = document.getElementById('photoModalTitle');
        const titleInput = document.getElementById('photoModalTitleInput');
        const commentInput = document.getElementById('photoModalCommentInput');
        const deleteBtn = document.getElementById('photoModalDeleteBtn');
        const albumsContainer = document.getElementById('photoModalAlbums');
        const metaEl = document.getElementById('photoModalMeta');

        if (titleEl) titleEl.textContent = photo.title || 'Photo';
        if (imgEl) {
          imgEl.src = photo.dataUrl;
          imgEl.alt = photo.title || 'Photo';
        }
        if (titleInput) titleInput.value = photo.title || '';
        if (commentInput) commentInput.value = photo.comment || '';
        if (deleteBtn) {
          deleteBtn.onclick = () => {
            closePhotoModal();
            deletePhoto(photoId);
          };
        }

        if (albumsContainer) {
          albumsContainer.innerHTML = albums.map(album => `
            <label class="album-checkbox">
              <input type="checkbox" value="${album.id}" ${photo.albumIds && photo.albumIds.includes(album.id) ? 'checked' : ''}>
              <span class="album-checkbox-label">${album.name}</span>
            </label>
          `).join('');
        }

        if (metaEl) {
          const dateStr = photo.createdAt ? new Date(photo.createdAt).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
          metaEl.innerHTML = `
            ${photo.createdBy ? `<span>👤 ${photo.createdBy}</span>` : ''}
            ${dateStr ? `<span>📅 ${dateStr}</span>` : ''}
          `;
        }

        const form = document.getElementById('photoModalForm');
        if (form) form.dataset.photoId = photoId;

        updatePhotoModalNav();
      }
    }

    function closePhotoModal() {
      const overlay = document.getElementById('photoModalOverlay');
      if (overlay) overlay.classList.remove('open');
      setTimeout(() => {
        const form = document.getElementById('photoModalForm');
        if (form) {
          form.reset();
          delete form.dataset.photoId;
        }
      }, 300);
    }

    async function savePhotoMeta(e) {
      e.preventDefault();
      const form = e.target;
      const photoId = form.dataset.photoId;
      if (!photoId) return;

      const titleInput = document.getElementById('photoModalTitleInput');
      const commentInput = document.getElementById('photoModalCommentInput');
      const albumsContainer = document.getElementById('photoModalAlbums');

      const selectedAlbumIds = [];
      if (albumsContainer) {
        albumsContainer.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
          selectedAlbumIds.push(cb.value);
        });
      }

      const existingPhoto = allPhotos[photoId];
      if (!existingPhoto) {
        showError('Photo introuvable');
        return;
      }

      try {
        setSyncStatus('syncing', 'Sauvegarde...');
        const updatedPhoto = {
          ...existingPhoto,
          title: titleInput?.value?.trim() || existingPhoto.title || '',
          comment: commentInput?.value?.trim() || existingPhoto.comment || '',
          albumIds: selectedAlbumIds,
          updatedAt: Date.now(),
          updatedBy: currentUser
        };
        await set(ref(db, 'photos/' + photoId), updatedPhoto);
        closePhotoModal();
        selectAlbum(currentAlbumId || (albums[0]?.id));
        setSyncStatus('ok', 'Sauvegardé');
      } catch (error) {
        console.error('Save photo meta error:', error);
        showError('Erreur sauvegarde: ' + error.message);
        setSyncStatus('error', 'Erreur');
      }
    }

    async function createAlbum() {
      const input = document.getElementById('newAlbumName');
      const name = input?.value?.trim();
      if (!name) {
        showError('Nom d\'album requis');
        return;
      }

      try {
        setSyncStatus('syncing', 'Création album...');
        await push(ref(db, 'albums'), {
          name,
          createdAt: Date.now(),
          createdBy: currentUser
        });
        input.value = '';
        document.getElementById('albumCreateForm').style.display = 'none';
        setSyncStatus('ok', 'Album créé');
      } catch (error) {
        console.error('Create album error:', error);
        showError('Erreur création: ' + error.message);
        setSyncStatus('error', 'Erreur');
      }
    }

    async function editAlbum(albumId) {
      const album = albums.find(a => a.id === albumId);
      if (!album) return;

      showEditModal(
        'Modifier le nom de l\'album',
        'Nouveau nom :',
        album.name,
        async (newName) => {
          if (!newName || newName.trim() === album.name) return;

          try {
            setSyncStatus('syncing', 'Modification...');
            await set(ref(db, 'albums/' + albumId), {
              ...album,
              name: newName.trim(),
              updatedAt: Date.now(),
              updatedBy: currentUser
            });
            setSyncStatus('ok', 'Album modifié');
          } catch (error) {
            console.error('Edit album error:', error);
            showError('Erreur modification: ' + error.message);
            setSyncStatus('error', 'Erreur');
          }
        }
      );
    }

    async function deleteAlbum(albumId) {
      showConfirmModal(
        'Supprimer cet album et toutes ses photos ?',
        'Cette action est irréversible.',
        async () => {
          try {
            setSyncStatus('syncing', 'Suppression album...');
            await remove(ref(db, 'albums/' + albumId));
            if (currentAlbumId === albumId) {
              currentAlbumId = null;
              const remainingAlbum = albums.find(a => a.id !== albumId);
              if (remainingAlbum) {
                selectAlbum(remainingAlbum.id);
              } else {
                renderAlbumTabs();
                renderAlbumGrid();
              }
            } else {
              renderAlbumTabs();
            }
            setSyncStatus('ok', 'Album supprimé');
          } catch (error) {
            console.error('Delete album error:', error);
            showError('Erreur suppression: ' + error.message);
            setSyncStatus('error', 'Erreur');
          }
        }
      );
    }

    // Upload zone drag & drop
    function setupUploadZone() {
      const zone = document.getElementById('uploadZone');
      const input = document.getElementById('photoUpload');
      if (!zone || !input) return;

      zone.addEventListener('click', () => input.click());

      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('drag-over');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('drag-over');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (e.dataTransfer.files.length) {
          handleFileUpload(e.dataTransfer.files);
        }
      });

      input.addEventListener('change', (e) => {
        if (e.target.files.length) {
          handleFileUpload(e.target.files);
          input.value = '';
        }
      });
    }

    // INITIALIZATION
    function init() {
      renderCalendarHeader();
    }

    // EVENT LISTENERS
    function setupEventListeners() {
      // Login form
      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const prenomInput = document.getElementById('prenom');
          const passwordInput = document.getElementById('password');
          const submitBtn = document.getElementById('submitBtn');
          const errorMsg = document.getElementById('errorMsg');

          const prenom = prenomInput?.value?.trim();
          const password = passwordInput?.value;

          console.log("[DEBUG] Login attempt:", prenom, password);

          if (errorMsg) errorMsg.classList.remove('show');
          if (submitBtn) {
            submitBtn.disabled = true;
            const span = submitBtn.querySelector('span');
            if (span) span.textContent = 'Connexion...';
          }

          await new Promise(r => setTimeout(r, 600));

          console.log("[DEBUG] Password check:", password, "vs", FAMILY_PASSWORD);

          if (password !== FAMILY_PASSWORD) {
            showError("Mot de passe incorrect");
            resetButton();
            return;
          }

          if (!prenom) {
            showError("Entre ton prénom.");
            resetButton();
            return;
          }

          try {
            setSyncStatus('syncing', 'Connexion...');
            console.log("[DEBUG] Calling firebase set...");
            await set(ref(db, 'users/' + prenom), {
              prenom: prenom,
              last_seen: Date.now(),
              online: true
            });
            console.log("[DEBUG] Firebase set succeeded");
            setSyncStatus('ok');
          } catch (e) {
            console.error('[DEBUG] User set failed:', e);
            showError('Erreur Firebase: ' + e.message);
            resetButton();
            return;
          }

          localStorage.setItem('montorlin-user', JSON.stringify({ prenom: prenom, loginTime: Date.now() }));

          const submitBtn2 = document.getElementById('submitBtn');
          if (submitBtn2) {
            const span2 = submitBtn2.querySelector('span');
            if (span2) span2.textContent = 'Bienvenue...';
            submitBtn2.style.background = 'linear-gradient(90deg, #22c55e, #4ade80)';
          }

          console.log("[DEBUG] Calling showApp...");
          setTimeout(() => showApp(prenom), 800);
        });
      }

      // Password toggle
      const passwordToggle = document.getElementById('passwordToggle');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordToggle && passwordInput && eyeIcon) {
        passwordToggle.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          eyeIcon.innerHTML = isPassword
            ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"></path>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        });
      }

      // Load saved user
      const savedUser = localStorage.getItem('montorlin-user');
      if (savedUser) {
        try {
          const { prenom } = JSON.parse(savedUser);
          if (prenom) {
            const prenomInput = document.getElementById('prenom');
            if (prenomInput) prenomInput.value = prenom;
          }
        } catch (e) {}
      }

      // Logout
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('montorlin-user');
          currentUser = null;
          reservations = [];
          const loginView = document.getElementById('loginView');
          const appView = document.getElementById('appView');
          if (loginView) loginView.style.display = 'block';
          if (appView) appView.style.display = 'none';
          const prenomInput2 = document.getElementById('prenom');
          const passwordInput2 = document.getElementById('password');
          if (prenomInput2) prenomInput2.value = '';
          const pw2 = document.getElementById('password');
          if (pw2) pw2.value = '';
          const pi2 = document.getElementById('prenom');
          if (pi2) pi2.focus();

          resetButton();
          if (logoutBtn) logoutBtn.blur();
        });
      }

      // Modal
      const modalClose = document.getElementById('modalClose');
      const modalOverlay = document.getElementById('modalOverlay');
      if (modalClose) modalClose.addEventListener('click', closeModal);
      if (modalOverlay) modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

      // Reservation form
      const reservationForm = document.getElementById('reservationForm');
      if (reservationForm) reservationForm.addEventListener('submit', saveReservation);

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        const appView = document.getElementById('appView');
        if (appView?.style.display === 'none') return;
        if (e.key === 'ArrowLeft') { updateMonth(-1); }
        else if (e.key === 'ArrowRight') { updateMonth(1); }
        else if (e.key === 'Escape') { closeModal(); }
      });

      // Album event listeners
      const createAlbumBtn = document.getElementById('createAlbumBtn');
      if (createAlbumBtn) createAlbumBtn.addEventListener('click', createAlbum);

      const newAlbumInput = document.getElementById('newAlbumName');
      if (newAlbumInput) {
        newAlbumInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') createAlbum();
        });
      }

      const newAlbumBtn = document.getElementById('newAlbumBtn');
      if (newAlbumBtn) {
        newAlbumBtn.addEventListener('click', () => {
          const form = document.getElementById('albumCreateForm');
          if (form) form.style.display = form.style.display === 'none' ? 'flex' : 'none';
          if (form.style.display !== 'none') {
            const input = document.getElementById('newAlbumName');
            if (input) input.focus();
          }
        });
      }

      const cancelAlbumBtn = document.getElementById('cancelAlbumBtn');
      if (cancelAlbumBtn) {
        cancelAlbumBtn.addEventListener('click', () => {
          const form = document.getElementById('albumCreateForm');
          if (form) form.style.display = 'none';
          const input = document.getElementById('newAlbumName');
          if (input) input.value = '';
        });
      }

      // Photo modal events
      const photoModalClose = document.getElementById('photoModalClose');
      const photoModalOverlay = document.getElementById('photoModalOverlay');
      if (photoModalClose) photoModalClose.addEventListener('click', closePhotoModal);
      if (photoModalOverlay) photoModalOverlay.addEventListener('click', (e) => { if (e.target === photoModalOverlay) closePhotoModal(); });

      // Photo modal nav
      const photoModalPrev = document.getElementById('photoModalPrev');
      const photoModalNext = document.getElementById('photoModalNext');
      if (photoModalPrev) photoModalPrev.addEventListener('click', () => navigatePhoto(-1));
      if (photoModalNext) photoModalNext.addEventListener('click', () => navigatePhoto(1));

      // Photo modal form
      const photoModalForm = document.getElementById('photoModalForm');
      if (photoModalForm) photoModalForm.addEventListener('submit', savePhotoMeta);

      // Upload zone
      setupUploadZone();

      // Keyboard escape for photo modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
          closePhotoModal();
        } else if (e.key === 'ArrowLeft') {
          const overlay = document.getElementById('photoModalOverlay');
          if (overlay?.classList.contains('open')) navigatePhoto(-1);
        } else if (e.key === 'ArrowRight') {
          const overlay = document.getElementById('photoModalOverlay');
          if (overlay?.classList.contains('open')) navigatePhoto(1);
        }
      });
    }

    // Calendar nav from header buttons
    document.addEventListener('click', (e) => {
      if (e.target.id === 'prevMonth') updateMonth(-1);
      else if (e.target.id === 'nextMonth') updateMonth(1);
    });

    // Expose functions to global scope for onclick handlers
    window.openPhotoModal = openPhotoModal;
    window.openModal = openModal;
    window.deletePhoto = deletePhoto;
    window.editAlbum = editAlbum;
    window.savePhotoMeta = savePhotoMeta;
    window.closePhotoModal = closePhotoModal;
    window.createAlbum = createAlbum;
    window.selectAlbum = selectAlbum;
    window.deleteAlbum = deleteAlbum;
    window.deleteReservation = deleteReservation;
    window.handleFileUpload = handleFileUpload;

    // Run init when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        init();
        setupEventListeners();
      });
    } else {
      init();
      setupEventListeners();
    }
  </script>
</body>
</html>
