<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Montorlin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest: #1a2e1a;
      --forest-dark: #0d1a0d;
      --forest-light: #2d4a2d;
      --moss: #4a6b3a;
      --moss-light: #5a7c4a;
      --cream: #f5f0e1;
      --cream-dark: #e8e0cc;
      --gold: #d4a843;
      --gold-light: #e8c06a;
      --gold-dark: #b89038;
      --white: #faf8f3;
      --text: #1a2e1a;
      --text-light: #3d5a3d;
      --reservation-colors: #e8c06a, #6ab8e8, #e87a6a, #8ae8a0, #d88ae8, #e8b06a;
      /* Mobile-first touch target */
      --touch-target: 44px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --forest: #0f1a0f;
        --forest-dark: #081008;
        --forest-light: #1a2a1a;
        --moss: #3a5a2a;
        --moss-light: #4a6a3a;
        --cream: #f5f0e1;
        --cream-dark: #e8e0cc;
        --gold: #c49833;
        --gold-light: #d8b05a;
        --gold-dark: #a88028;
        --white: #e8e0d0;
        --text: #e8e0d0;
        --text-light: #c8d0c8;
      }
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--forest);
      min-height: 100vh;
      color: var(--cream);
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(74, 107, 58, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212, 168, 67, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .mountains {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40vh;
      min-height: 200px;
      max-height: 300px;
      pointer-events: none;
      z-index: 1;
    }
    .mountain {
      position: absolute;
      bottom: 0;
      border-style: solid;
      border-bottom: 0;
    }
    .mountain-1 { left: -10%; width: 0; height: 0; border-left: 60vw solid transparent; border-right: 60vw solid transparent; border-top: 35vh solid var(--forest-dark); opacity: 0.6; }
    .mountain-2 { left: 15%; width: 0; height: 0; border-left: 45vw solid transparent; border-right: 45vw solid transparent; border-top: 28vh solid var(--forest); opacity: 0.8; }
    .mountain-3 { right: -5%; width: 0; height: 0; border-left: 50vw solid transparent; border-right: 50vw solid transparent; border-top: 32vh solid var(--forest-dark); opacity: 0.5; }
    .mountain-4 { right: 20%; width: 0; height: 0; border-left: 35vw solid transparent; border-right: 35vw solid transparent; border-top: 22vh solid var(--forest); opacity: 0.7; }
    .moon {
      position: fixed;
      top: 8%;
      right: 12%;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f5f0e1 0%, #e8dcc0 40%, #d4c4a0 100%);
      box-shadow: 
        0 0 40px rgba(212, 168, 67, 0.4),
        0 0 80px rgba(212, 168, 67, 0.2),
        inset -5px -5px 20px rgba(0,0,0,0.1);
      pointer-events: none;
      z-index: 1;
      animation: moonGlow 4s ease-in-out infinite alternate;
    }
    @keyframes moonGlow {
      0% { box-shadow: 0 0 40px rgba(212, 168, 67, 0.4), 0 0 80px rgba(212, 168, 67, 0.2), inset -5px -5px 20px rgba(0,0,0,0.1); }
      100% { box-shadow: 0 0 60px rgba(212, 168, 67, 0.6), 0 0 120px rgba(212, 168, 67, 0.3), inset -5px -5px 20px rgba(0,0,0,0.1); }
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image: 
        radial-gradient(1px 1px at 10% 20%, #fff, transparent),
        radial-gradient(1px 1px at 30% 40%, #fff, transparent),
        radial-gradient(1px 1px at 50% 15%, #fff, transparent),
        radial-gradient(1px 1px at 70% 30%, #fff, transparent),
        radial-gradient(1px 1px at 90% 25%, #fff, transparent),
        radial-gradient(1px 1px at 20% 60%, #fff, transparent),
        radial-gradient(1px 1px at 80% 50%, #fff, transparent),
        radial-gradient(1px 1px at 40% 70%, #fff, transparent),
        radial-gradient(1px 1px at 60% 80%, #fff, transparent),
        radial-gradient(1px 1px at 15% 85%, #fff, transparent);
      background-repeat: repeat;
      background-size: 400px 400px;
      opacity: 0.3;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; }
      100% { opacity: 0.5; }
    }
    .card {
      position: relative;
      z-index: 10;
      background: linear-gradient(145deg, rgba(26, 46, 26, 0.95), rgba(13, 26, 13, 0.98));
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 24px;
      padding: 1.5rem;
      width: 100%;
      max-width: 1000px;
      margin: 0.75rem auto;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(74, 107, 58, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
    }
    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 0.75rem;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 8px 32px rgba(212, 168, 67, 0.4),
        0 0 0 2px rgba(212, 168, 67, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }
    .logo-icon svg { width: 32px; height: 32px; color: var(--forest-dark); }
    h1 { font-size: 1.8rem; font-weight: 400; letter-spacing: 0.05em; color: var(--cream); margin-bottom: 0.25rem; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    h2 { font-size: 1.3rem; font-weight: 400; color: var(--cream); margin-bottom: 0.75rem; }
    h3 { font-size: 1.1rem; font-weight: 500; color: var(--cream); margin-bottom: 0.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 0.4rem; opacity: 0.9; }
    input, select, textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(13, 26, 13, 0.8);
      border: 2px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      color: var(--cream);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
      min-height: var(--touch-target);
    }
    input::placeholder, textarea::placeholder { color: rgba(200, 220, 200, 0.5); }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.15), 0 0 20px rgba(212, 168, 67, 0.1);
      background: rgba(13, 26, 13, 0.95);
    }
    input:not(:placeholder-shown), select:not([value=""]) { border-color: var(--moss-light); }
    .btn {
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      min-height: var(--touch-target);
      min-width: var(--touch-target);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      background-size: 200% 100%;
      transition: background-position 0.4s ease;
    }
    .btn span { position: relative; z-index: 1; color: var(--forest-dark); }
    .btn:hover::before { background-position: 200% 0; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:disabled::before { background-position: 0 0; }
    .btn-secondary { background: var(--forest-light); color: var(--cream); }
    .btn-secondary::before { background: linear-gradient(90deg, var(--moss) 0%, var(--moss-light) 100%); }
    .btn-danger { background: var(--forest-light); color: #e87a6a; }
    .btn-danger::before { background: linear-gradient(90deg, #c85a4a 0%, #e87a6a 100%); }
    .btn-icon { padding: 0.625rem; }
    .error-message {
      display: none;
      text-align: center;
      padding: 0.875rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .error-message.show { display: block; }
    .footer-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--moss);
      opacity: 0.6;
    }
    .footer-note a { color: var(--gold-light); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }

    /* App Header - Mobile First */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(74, 107, 58, 0.2);
    }
    .app-header h1 { 
      font-size: 1.5rem; 
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      margin: 0; 
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.75rem;
      background: rgba(74, 107, 58, 0.15);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-indicator .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--forest-dark);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .header-btn {
      padding: 0.5rem 0.875rem;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    /* Tab Navigation - Horizontal Scroll on Mobile */
    .tab-nav {
      display: flex;
      gap: 0.375rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(74, 107, 58, 0.2);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      padding: 0 0.25rem 0.75rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 0 0 auto;
      scroll-snap-align: start;
      padding: 0.625rem 1rem;
      background: var(--forest-light);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 999px;
      color: var(--moss-light);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-height: var(--touch-target);
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }
    .tab-btn:hover {
      background: var(--forest);
      border-color: var(--gold);
      color: var(--cream);
    }
    .tab-btn.active {
      background: linear-gradient(90deg, var(--moss) 0%, var(--moss-light) 100%);
      border-color: var(--moss-light);
      color: var(--forest-dark);
    }
    .tab-content {
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Calendar Styles */
    .calendar-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .calendar-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding: 0 0.25rem;
    }
    .calendar-header-title { font-size: 1.1rem; color: var(--cream); margin: 0; }
    .calendar-nav {
      display: flex;
      gap: 0.375rem;
    }
    .calendar-nav-btn {
      width: var(--touch-target);
      height: var(--touch-target);
      border-radius: 10px;
      background: var(--forest-light);
      border: 1px solid rgba(74, 107, 58, 0.3);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
      line-height: 1;
    }
    .calendar-nav-btn:hover {
      background: var(--forest);
      border-color: var(--gold);
      color: var(--gold);
    }
    .calendar-nav-btn:active { transform: scale(0.95); }
    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 6px;
      padding: 0 3px;
    }
    .calendar-day-name {
      text-align: center;
      padding: 0.5rem 0;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gold-light);
      opacity: 0.9;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .calendar-day {
      min-height: 72px;
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 10px;
      padding: 0.375rem;
      position: relative;
      transition: all 0.2s ease;
      min-width: 0;
    }
    .calendar-day:hover {
      background: rgba(13, 26, 13, 0.9);
      border-color: var(--gold);
    }
    .calendar-day.other-month { opacity: 0.3; }
    .calendar-day.today {
      border-color: var(--gold);
      box-shadow: inset 0 0 0 2px var(--gold);
    }
    .calendar-day.today::before {
      content: '';
      position: absolute;
      top: 3px; right: 3px;
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
    }
    .day-number {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 0.25rem;
      line-height: 1.2;
    }
    .calendar-day.other-month .day-number { color: var(--moss); }
    .reservations-list { display: flex; flex-direction: column; gap: 3px; }
    .reservation-chip {
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 0.6rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: transform 0.15s ease;
      border: 1px solid transparent;
      min-height: 28px;
      display: flex;
      align-items: center;
    }
    .reservation-chip:hover { transform: scale(1.02); z-index: 10; border-color: rgba(255,255,255,0.3); }
    .more-reservations {
      font-size: 0.55rem;
      color: var(--moss-light);
      text-align: center;
      padding: 2px;
      opacity: 0.7;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: linear-gradient(145deg, rgba(26, 46, 26, 0.98), rgba(13, 26, 13, 0.99));
      border: 1px solid rgba(74, 107, 58, 0.4);
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-title { font-size: 1.3rem; color: var(--cream); margin: 0; }
    .modal-close {
      background: none; border: none; color: var(--moss-light); font-size: 1.5rem; cursor: pointer; padding: 0.5rem;
      opacity: 0.7; transition: opacity 0.2s; min-width: var(--touch-target); min-height: var(--touch-target);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { opacity: 1; color: var(--cream); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    textarea { min-height: 90px; resize: vertical; font-family: inherit; }

    .reservation-detail {
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .reservation-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .reservation-detail-title { font-size: 1.1rem; color: var(--cream); font-weight: 500; margin: 0; }
    .reservation-detail-meta { display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.8rem; color: var(--moss-light); }
    .reservation-detail-dates { display: flex; gap: 1rem; font-size: 0.75rem; }
    .reservation-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .reservation-actions .btn { flex: 1; }

    .reservations-panel {
      background: rgba(13, 26, 13, 0.5);
      border: 1px solid rgba(74, 107, 58, 0.2);
      border-radius: 16px;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .reservations-list-full { display: flex; flex-direction: column; gap: 0.625rem; }
    .reservation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.875rem;
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 10px;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .reservation-item-info { flex: 1; min-width: 180px; }
    .reservation-item-title { font-weight: 600; color: var(--cream); margin-bottom: 0.2rem; font-size: 0.95rem; }
    .reservation-item-meta { display: flex; gap: 1rem; font-size: 0.7rem; color: var(--moss-light); flex-wrap: wrap; }
    .reservation-item-actions { display: flex; gap: 0.375rem; }
    .reservation-item-actions .btn { padding: 0.5rem 0.875rem; font-size: 0.75rem; }

    .color-legend { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(74, 107, 58, 0.2); }
    .color-legend-item { display: flex; align-items: center; gap: 0.375rem; font-size: 0.7rem; color: var(--moss-light); }
    .color-legend-dot { width: 10px; height: 10px; border-radius: 3px; }

    .sync-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.75rem;
      background: rgba(74, 107, 58, 0.15);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sync-indicator .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite;
    }
    .sync-indicator.syncing .dot { background: #f59e0b; animation: none; }
    .sync-indicator.error .dot { background: #ef4444; animation: none; }

    /* Mobile-first responsive */
    @media (min-width: 480px) {
      .card { padding: 2rem; margin: 1rem auto; border-radius: 24px; }
      h1 { font-size: 2.2rem; }
      .logo-icon { width: 72px; height: 72px; }
      .logo-icon svg { width: 36px; height: 36px; }
      .calendar-day { min-height: 100px; padding: 0.5rem; }
      .day-number { font-size: 1.1rem; }
      .form-row { grid-template-columns: 1fr 1fr; }
      .reservation-item { flex-wrap: nowrap; }
      .reservation-item-actions { width: auto; }
      .tab-nav { flex-wrap: nowrap; overflow-x: visible; }
      .tab-btn { flex: 1; text-align: center; }
      .header-actions { gap: 1rem; }
    }
    @media (min-width: 768px) {
      .calendar-container { overflow-x: visible; }
      .calendar-nav-btn { width: 40px; height: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {

  <!-- MODAL FOR RESERVATION -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <header class="modal-header">
        <h2 class="modal-title" id="modalTitle">Nouvelle réservation</h2>
        <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
      </header>
      <form id="reservationForm">
        <input type="hidden" id="reservationId">
        <div class="form-group">
          <label for="resTitle">Titre</label>
          <input type="text" id="resTitle" placeholder="Ex: Week-end ski, Anniversaire Léa..." required maxlength="100">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="resStart">Arrivée</label>
            <input type="date" id="resStart" required>
          </div>
          <div class="form-group">
            <label for="resEnd">Départ</label>
            <input type="date" id="resEnd" required>
          </div>
        </div>
        <div class="form-group">
          <label for="resColor">Couleur</label>
          <select id="resColor">
            <option value="#e8c06a">🟡 Or</option>
            <option value="#6ab8e8">🔵 Bleu</option>
            <option value="#e87a6a">🔴 Rouge</option>
            <option value="#8ae8a0">🟢 Vert</option>
            <option value="#d88ae8">🟣 Violet</option>
            <option value="#e8b06a">🟠 Orange</option>
          </select>
        </div>
        <div class="form-group">
          <label for="resNotes">Notes</label>
          <textarea id="resNotes" placeholder="Détails, nombre de personnes, matériel..."></textarea>
        </div>
        <div class="reservation-actions">
          <button type="button" class="btn btn-danger" id="deleteReservationBtn" style="display: none;"><span>Supprimer</span></button>
          <button type="submit" class="btn"><span id="modalSubmitText">Créer</span></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Realtime Database SDK (CDN) -->
  <script type="module">
    console.log("[DEBUG] Module script STARTED - Firebase initialization");
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, push, remove, set, onValue, query, orderByChild, limitToLast, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    // Firebase config (Realtime Database) - using the working site-montorlin project
    const firebaseConfig = {
      apiKey: "AIzaSyBzQTifoKJrIpipX3H0t-y9uFWcnAQrDZw",
      authDomain: "site-montorlin.firebaseapp.com",
      databaseURL: "https://site-montorlin-default-rtdb.firebaseio.com",
      projectId: "site-montorlin",
      storageBucket: "site-montorlin.firebasestorage.app",
      messagingSenderId: "109488883918",
      appId: "1:109488883918:web:d8c4b9fcc379aea9e7e89f"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const reservationsRef = ref(db, 'reservations');
    console.log("[DEBUG] Firebase initialized, db:", db, "reservationsRef:", reservationsRef);

    const FAMILY_PASSWORD = "refuge2026";

    const RESERVATION_COLORS = [
      { value: '#e8c06a', label: 'Or' },
      { value: '#6ab8e8', label: 'Bleu' },
      { value: '#e87a6a', label: 'Rouge' },
      { value: '#8ae8a0', label: 'Vert' },
      { value: '#d88ae8', label: 'Violet' },
      { value: '#e8b06a', label: 'Orange' }
    ];

    // State
    let currentUser = null;
    let currentMonth = new Date();
    let reservations = [];
    let familyMembers = [];

    // NO DOM element declarations at module level!
    // ALL DOM queries happen INSIDE functions

    // Sync status
    function setSyncStatus(status, text) {
      const indicator = document.getElementById('syncIndicator');
      if (!indicator) return;
      indicator.classList.remove('syncing', 'error');
      if (status === 'syncing') indicator.classList.add('syncing');
      else if (status === 'error') indicator.classList.add('error');
      const textEl = document.getElementById('syncText');
      if (textEl) textEl.textContent = text || (status === 'ok' ? 'Synchronisé' : status === 'syncing' ? 'Synchronisation...' : 'Erreur');
    }

    // Helper: format date for input
    function formatDateForInput(date) {
      if (typeof date === 'string') return date;
      return date.toISOString().split('T')[0];
    }

    function formatDateFR(date) {
      return date.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getColorForUser(prenom) {
      const colors = RESERVATION_COLORS.map(c => c.value);
      let hash = 0;
      for (let i = 0; i < prenom.length; i++) hash = prenom.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    // Normalize reservation data - handles both old and new formats
    function normalizeReservation(id, val) {
      return {
        id,
        title: val.title || val.name || '',
        start_date: val.start_date || val.start || val.startDate || '',
        end_date: val.end_date || val.end || val.endDate || '',
        color: val.color || getColorForUser(val.prenom || val.author || 'Inconnu'),
        notes: val.notes || '',
        prenom: val.prenom || val.author || val.user || 'Inconnu',
        timestamp: val.timestamp || val.createdAt || val.time || Date.now()
      };
    }

    // CALENDAR FUNCTIONS
    function renderCalendarHeader() {
      const headerEl = document.getElementById('calendarHeader');
      if (!headerEl) return;
      const days = ['LUN', 'MAR', 'MER', 'JEU', 'VEN', 'SAM', 'DIM'];
      headerEl.innerHTML = days.map(d => `<div class="calendar-day-name">${d}</div>`).join('');
    }

    function getMonthDays(year, month) {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDay = (firstDay.getDay() + 6) % 7;
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      const days = [];
      for (let i = startingDay - 1; i >= 0; i--) {
        days.push({ date: new Date(year, month - 1, prevMonthLastDay - i), otherMonth: true });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        days.push({ date: new Date(year, month, d), otherMonth: false });
      }
      const totalCells = Math.ceil((startingDay + daysInMonth) / 7) * 7;
      for (let d = 1; days.length < totalCells; d++) {
        days.push({ date: new Date(year, month + 1, d), otherMonth: true });
      }
      return days;
    }

    function getReservationsForDay(dateStr) {
      return reservations.filter(r => {
        const start = new Date(r.start_date);
        const end = new Date(r.end_date);
        const check = new Date(dateStr);
        return check >= start && check <= end;
      });
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
      
      const headerTitle = document.getElementById('calendarTitle');
      if (headerTitle) headerTitle.textContent = `${monthNames[month]} ${year}`;

      const days = getMonthDays(year, month);
      const gridEl = document.getElementById('calendarGrid');
      if (!gridEl) return;
      
      gridEl.innerHTML = days.map(day => {
        const dateStr = formatDateForInput(day.date);
        const dayReservations = getReservationsForDay(dateStr);
        const isToday = day.date.toDateString() === new Date().toDateString();
        const isOtherMonth = day.otherMonth;
        
        return `
          <div class="calendar-day ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}" data-date="${dateStr}" role="gridcell" aria-label="${dateStr}${dayReservations.length ? ': ' + dayReservations.map(r => r.title).join(', ') : ''}">
            <div class="day-number">${day.date.getDate()}</div>
            <div class="reservations-list">
              ${dayReservations.slice(0, 3).map(r => `
                <div class="reservation-chip" style="background: ${r.color}; border-color: ${r.color};" data-id="${r.id}" title="${r.title} - ${r.prenom}${r.notes ? ': ' + r.notes : ''}">
                  ${r.title}
                </div>
              `).join('')}
              ${dayReservations.length > 3 ? `<div class="more-reservations">+${dayReservations.length - 3} autres</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.calendar-day:not(.other-month)').forEach(dayEl => {
        dayEl.addEventListener('click', (e) => {
          if (!e.target.closest('.reservation-chip')) {
            openModal(dayEl.dataset.date);
          }
        });
      });

      document.querySelectorAll('.reservation-chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          openModal(null, chip.dataset.id);
        });
      });
    }

    function updateMonth(delta) {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
      renderCalendar();
    }

    function renderReservationsList() {
      const upcoming = [...reservations]
        .filter(r => new Date(r.end_date) >= new Date())
        .sort((a, b) => new Date(a.start_date) - new Date(b.start_date))
        .slice(0, 10);

      const listEl = document.getElementById('reservationsList');
      if (!listEl) return;

      if (upcoming.length === 0) {
        if (listEl) listEl.innerHTML = '<p style="text-align: center; color: var(--moss-light); padding: 2rem;">Aucune réservation à venir. Cliquez sur un jour pour en créer une.</p>';
        return;
      }

      if (listEl) {
        listEl.innerHTML = upcoming.map(r => `
          <div class="reservation-item" style="border-left: 4px solid ${r.color};">
            <div class="reservation-item-info">
              <div class="reservation-item-title">${r.title}</div>
              <div class="reservation-item-meta">
                <span>${formatDateFR(new Date(r.start_date))} → ${formatDateFR(new Date(r.end_date))}</span>
                <span>Par ${r.prenom}</span>
              </div>
            </div>
            <div class="reservation-item-actions">
              <button class="btn btn-secondary" onclick="openModal(null, '${r.id}')" style="padding: 0.5rem 1rem; font-size: 0.85rem;"><span>Modifier</span></button>
              <button class="btn btn-danger" onclick="deleteReservation('${r.id}')" style="padding: 0.5rem 1rem; font-size: 0.85rem;"><span>Supprimer</span></button>
            </div>
          </div>
        `).join('');
      }
    }

    function renderColorLegend() {
      const userColors = {};
      reservations.forEach(r => { userColors[r.prenom] = r.color; });
      
      const legendEl = document.getElementById('colorLegend');
      if (!legendEl) return;
      
      legendEl.innerHTML = Object.entries(userColors).map(([prenom, color]) => `
        <div class="color-legend-item">
          <span class="color-legend-dot" style="background: ${color};"></span>
          ${prenom}
        </div>
      `).join('');
    }

    // MODAL FUNCTIONS
    function openModal(dateStr = null, reservationId = null) {
      const modalOverlay = document.getElementById('modalOverlay');
      const isEdit = !!reservationId;
      
      // Declare all DOM elements once at the top
      const titleEl = document.getElementById('modalTitle');
      const submitTextEl = document.getElementById('modalSubmitText');
      const idInput = document.getElementById('reservationId');
      const titleInput = document.getElementById('resTitle');
      const startInput = document.getElementById('resStart');
      const endInput = document.getElementById('resEnd');
      const colorSelect = document.getElementById('resColor');
      const notesInput = document.getElementById('resNotes');
      const deleteBtn = document.getElementById('deleteReservationBtn');
      
      if (isEdit) {
        const res = reservations.find(r => r.id === reservationId);
        if (!res) return;
        if (titleEl) titleEl.textContent = 'Modifier la réservation';
        if (submitTextEl) submitTextEl.textContent = 'Enregistrer';
        if (idInput) idInput.value = res.id;
        if (titleInput) titleInput.value = res.title;
        if (startInput) startInput.value = formatDateForInput(new Date(res.start_date));
        if (endInput) endInput.value = formatDateForInput(new Date(res.end_date));
        if (colorSelect) colorSelect.value = res.color;
        if (notesInput) notesInput.value = res.notes || '';
        if (deleteBtn) {
          deleteBtn.style.display = 'inline-flex';
          deleteBtn.onclick = () => deleteReservation(res.id);
        }
      } else {
        if (titleEl) titleEl.textContent = 'Nouvelle réservation';
        if (submitTextEl) submitTextEl.textContent = 'Créer';
        if (idInput) idInput.value = '';
        if (titleInput) titleInput.value = '';
        if (startInput) startInput.value = dateStr || formatDateForInput(new Date());
        if (endInput) endInput.value = dateStr || formatDateForInput(new Date());
        if (colorSelect) colorSelect.value = getColorForUser(currentUser);
        if (notesInput) notesInput.value = '';
        if (deleteBtn) deleteBtn.style.display = 'none';
      }
      
      const modal = document.getElementById('modalOverlay');
      if (modal) modal.classList.add('open');
      setTimeout(() => {
        if (titleInput) titleInput.focus();
      }, 100);
    }

    function closeModal() {
      const modal = document.getElementById('modalOverlay');
      if (modal) modal.classList.remove('open');
      setTimeout(() => {
        const form = document.getElementById('reservationForm');
        if (form) form.reset();
        const idInput = document.getElementById('reservationId');
        if (idInput) idInput.value = '';
        const deleteBtn = document.getElementById('deleteReservationBtn');
        if (deleteBtn) deleteBtn.style.display = 'none';
      }, 300);
    }

    // RESERVATION CRUD - Firebase Realtime Database
    async function loadReservations() {
      console.log("[DEBUG] loadReservations called");
      setSyncStatus('syncing', 'Chargement...');
      try {
        const reservationsQuery = query(reservationsRef, orderByChild('timestamp'), limitToLast(100));
        onValue(reservationsQuery, (snapshot) => {
          console.log("[DEBUG] onValue callback triggered, snapshot:", snapshot.val());
          const data = snapshot.val();
          if (data) {
            reservations = Object.entries(data).map(([id, val]) => normalizeReservation(id, val))
              .sort((a, b) => b.timestamp - a.timestamp);
          } else {
            reservations = [];
          }
          console.log("[DEBUG] Reservations loaded:", reservations);
          renderCalendar();
          renderReservationsList();
          renderColorLegend();
          setSyncStatus('ok', 'Synchronisé');
        }, (error) => {
          console.error('Firebase error:', error);
          setSyncStatus('error', 'Erreur de connexion');
        });
      } catch (error) {
        console.error('Load reservations error:', error);
        setSyncStatus('error', 'Erreur chargement');
      }
    }

    async function saveReservation(e) {
      e.preventDefault();
      
      const idInput = document.getElementById('reservationId');
      const titleInput = document.getElementById('resTitle');
      const startInput = document.getElementById('resStart');
      const endInput = document.getElementById('resEnd');
      const colorSelect = document.getElementById('resColor');
      const notesInput = document.getElementById('resNotes');
      const errorMsg = document.getElementById('errorMsg');
      const submitTextEl = document.getElementById('modalSubmitText');
      
      const isEdit = !!idInput?.value;
      const title = titleInput?.value?.trim();
      const start = startInput?.value;
      const end = endInput?.value;
      const color = colorSelect?.value;
      const notes = notesInput?.value?.trim();
      
      if (!title || !start || !end) {
        showError('Titre, arrivée et départ requis.');
        return;
      }
      if (new Date(end) < new Date(start)) {
        showError('La date de départ doit être après l\'arrivée.');
        return;
      }

      const reservationData = {
        title,
        start_date: start,
        end_date: end,
        color,
        notes,
        prenom: currentUser,
        timestamp: Date.now()
      };

      try {
        setSyncStatus('syncing', isEdit ? 'Mise à jour...' : 'Création...');
        
        if (isEdit) {
          const resId = document.getElementById('reservationId')?.value;
          await set(ref(db, 'reservations/' + resId), reservationData);
        } else {
          await push(reservationsRef, reservationData);
        }
        
        closeModal();
        setSyncStatus('ok', 'Synchronisé');
      } catch (error) {
        console.error('Save reservation error:', error);
        showError('Erreur lors de la sauvegarde: ' + error.message);
        setSyncStatus('error', 'Erreur');
      }
    }

    async function deleteReservation(id) {
      if (!confirm('Supprimer cette réservation ?')) return;
      
      try {
        setSyncStatus('syncing', 'Suppression...');
        await remove(ref(db, 'reservations/' + id));
        closeModal();
        setSyncStatus('ok', 'Synchronisé');
      } catch (error) {
        console.error('Delete error:', error);
        showError('Erreur suppression: ' + error.message);
        setSyncStatus('error', 'Erreur');
      }
    }

    function showError(message) {
      const errorMsg = document.getElementById('errorMsg');
      if (errorMsg) {
        errorMsg.textContent = message;
        errorMsg.classList.add('show');
      }
      const prenomInput = document.getElementById('prenom');
      if (prenomInput) prenomInput.style.borderColor = 'rgba(239, 68, 68, 0.5)';
      const passwordInput = document.getElementById('password');
      if (passwordInput) passwordInput.style.borderColor = 'rgba(239, 68, 68, 0.5)';
      setTimeout(() => {
        const p = document.getElementById('prenom');
        if (p) p.style.borderColor = '';
        const pw = document.getElementById('password');
        if (pw) pw.style.borderColor = '';
      }, 3000);
    }

    function resetButton() {
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) {
        submitBtn.disabled = false;
        const span = submitBtn.querySelector('span');
        if (span) span.textContent = 'Entrer';
        submitBtn.style.background = '';
      }
    }

    function showApp(prenom) {
      console.log("[DEBUG] showApp called with:", prenom);
      const loginView = document.getElementById('loginView');
      const appView = document.getElementById('appView');
      
      if (loginView) loginView.style.display = 'none';
      if (appView) appView.style.display = 'block';
      currentUser = prenom;
      
      const userAvatar = document.getElementById('userAvatar');
      if (userAvatar) userAvatar.textContent = prenom.charAt(0).toUpperCase();
      
      const syncIndicator = document.getElementById('syncIndicator');
      if (syncIndicator) syncIndicator.style.display = 'inline-flex';
      
      localStorage.setItem('montorlin-user', JSON.stringify({ prenom, loginTime: Date.now() }));
      
      loadFamilyMembers();
      loadReservations();
      renderCalendarHeader();
    }

    async function loadFamilyMembers() {
      try {
        const usersRef = ref(db, 'users');
        onValue(usersRef, (snapshot) => {
          const data = snapshot.val();
          if (data) {
            familyMembers = Object.values(data).map(u => u.prenom);
          }
        });
      } catch (e) { console.warn('Could not load family members:', e); }
    }

    // INITIALIZATION - runs when DOM is ready
    function init() {
      // Calendar header
      renderCalendarHeader();
      
      // Check existing session
      const savedUser = localStorage.getItem('montorlin-user');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          showApp(user.prenom);
          return;
        } catch {
          localStorage.removeItem('montorlin-user');
        }
      }
      
      // Calendar navigation
      const prevBtn = document.getElementById('prevMonth');
      const nextBtn = document.getElementById('nextMonth');
      if (prevBtn) prevBtn.addEventListener('click', () => updateMonth(-1));
      if (nextBtn) nextBtn.addEventListener('click', () => updateMonth(1));
    }

    // EVENT LISTENERS - all DOM queries inside functions
    function setupEventListeners() {
      // Login form
      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const prenomInput = document.getElementById('prenom');
          const passwordInput = document.getElementById('password');
          const submitBtn = document.getElementById('submitBtn');
          const errorMsg = document.getElementById('errorMsg');
          
          const prenom = prenomInput?.value?.trim();
          const password = passwordInput?.value;

          console.log("[DEBUG] Login attempt:", prenom, password);
          
          if (errorMsg) errorMsg.classList.remove('show');
          if (submitBtn) {
            submitBtn.disabled = true;
            const span = submitBtn.querySelector('span');
            if (span) span.textContent = 'Connexion...';
          }

          await new Promise(r => setTimeout(r, 600));

          console.log("[DEBUG] Password check:", password, "vs", FAMILY_PASSWORD);
          
          if (password !== FAMILY_PASSWORD) {
            showError("Ce n'est pas le bon mot de passe familial.");
            resetButton();
            return;
          }

          if (!prenom) {
            showError("Entre ton prénom.");
            resetButton();
            return;
          }

          // Save to Firebase
          try {
            setSyncStatus('syncing', 'Connexion...');
            console.log("[DEBUG] Calling firebase set...");
            await set(ref(db, 'users/' + prenom), {
              prenom: prenom,
              last_seen: Date.now(),
              online: true
            });
            console.log("[DEBUG] Firebase set succeeded");
            setSyncStatus('ok');
          } catch (e) { 
            console.error('[DEBUG] User set failed:', e);
            showError('Erreur Firebase: ' + e.message);
            resetButton();
            return;
          }

          localStorage.setItem('montorlin-user', JSON.stringify({ prenom: prenom, loginTime: Date.now() }));
          
          const submitBtn2 = document.getElementById('submitBtn');
          if (submitBtn2) {
            const span2 = submitBtn2.querySelector('span');
            if (span2) span2.textContent = 'Bienvenue...';
            submitBtn2.style.background = 'linear-gradient(90deg, #22c55e, #4ade80)';
          }
          
          console.log("[DEBUG] Calling showApp...");
          setTimeout(() => showApp(prenom), 800);
        });
      }

      // Logout
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('montorlin-user');
          currentUser = null;
          reservations = [];
          const loginView = document.getElementById('loginView');
          const appView = document.getElementById('appView');
          if (loginView) loginView.style.display = 'block';
          if (appView) appView.style.display = 'none';
          const prenomInput2 = document.getElementById('prenom');
          const passwordInput2 = document.getElementById('password');
          if (prenomInput2) prenomInput2.value = '';
          const pw2 = document.getElementById('password');
          if (pw2) pw2.value = '';
          const pi2 = document.getElementById('prenom');
          if (pi2) pi2.focus();
        });
      }

      // Modal
      const modalClose = document.getElementById('modalClose');
      const modalOverlay = document.getElementById('modalOverlay');
      if (modalClose) modalClose.addEventListener('click', closeModal);
      if (modalOverlay) modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

      // Reservation form
      const reservationForm = document.getElementById('reservationForm');
      if (reservationForm) reservationForm.addEventListener('submit', saveReservation);

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        const appView = document.getElementById('appView');
        if (appView?.style.display === 'none') return;
        if (e.key === 'ArrowLeft') { updateMonth(-1); }
        else if (e.key === 'ArrowRight') { updateMonth(1); }
        else if (e.key === 'Escape') { closeModal(); }
      });

      // Tab navigation
      const tabBtns = document.querySelectorAll('.tab-btn');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          // Update active button
          tabBtns.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          // Show/hide tab content
          document.querySelectorAll('.tab-content').forEach(content => {
            content.style.display = 'none';
          });
          const targetContent = document.getElementById('tabContent' + tab.charAt(0).toUpperCase() + tab.slice(1));
          if (targetContent) {
            targetContent.style.display = 'block';
            targetContent.setAttribute('aria-hidden', 'false');
          }
          // Update aria-hidden on others
          document.querySelectorAll('.tab-content').forEach(content => {
            if (content !== targetContent) content.setAttribute('aria-hidden', 'true');
          });
        });
      });
    }

    // Also handle calendar nav from header buttons
    document.addEventListener('click', (e) => {
      if (e.target.id === 'prevMonth') updateMonth(-1);
      else if (e.target.id === 'nextMonth') updateMonth(1);
    });

    // Run init when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        init();
        setupEventListeners();
      });
    } else {
      init();
      setupEventListeners();
    }
  </script>
</body>
</html>
