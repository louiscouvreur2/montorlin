<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Montorlin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest: #1a2e1a;
      --forest-dark: #0d1a0d;
      --forest-light: #2d4a2d;
      --moss: #4a6b3a;
      --moss-light: #5a7c4a;
      --cream: #f5f0e1;
      --cream-dark: #e8e0cc;
      --gold: #d4a843;
      --gold-light: #e8c06a;
      --gold-dark: #b89038;
      --white: #faf8f3;
      --text: #1a2e1a;
      --text-light: #3d5a3d;
      --reservation-colors: #e8c06a, #6ab8e8, #e87a6a, #8ae8a0, #d88ae8, #e8b06a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --forest: #0f1a0f;
        --forest-dark: #081008;
        --forest-light: #1a2a1a;
        --moss: #3a5a2a;
        --moss-light: #4a6a3a;
        --cream: #1a2e1a;
        --cream-dark: #2d4a2d;
        --gold: #c49833;
        --gold-light: #d8b05a;
        --gold-dark: #a88028;
        --white: #e8e0d0;
        --text: #e8e0d0;
        --text-light: #c8d0c8;
      }
    }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--forest);
      min-height: 100vh;
      color: var(--white);
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(74, 107, 58, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212, 168, 67, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .mountains {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40vh;
      min-height: 200px;
      max-height: 300px;
      pointer-events: none;
      z-index: 1;
    }
    .mountain {
      position: absolute;
      bottom: 0;
      border-style: solid;
      border-bottom: 0;
    }
    .mountain-1 { left: -10%; width: 0; height: 0; border-left: 60vw solid transparent; border-right: 60vw solid transparent; border-top: 35vh solid var(--forest-dark); opacity: 0.6; }
    .mountain-2 { left: 15%; width: 0; height: 0; border-left: 45vw solid transparent; border-right: 45vw solid transparent; border-top: 28vh solid var(--forest); opacity: 0.8; }
    .mountain-3 { right: -5%; width: 0; height: 0; border-left: 50vw solid transparent; border-right: 50vw solid transparent; border-top: 32vh solid var(--forest-dark); opacity: 0.5; }
    .mountain-4 { right: 20%; width: 0; height: 0; border-left: 35vw solid transparent; border-right: 35vw solid transparent; border-top: 22vh solid var(--forest); opacity: 0.7; }
    .moon {
      position: fixed;
      top: 8%;
      right: 12%;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f5f0e1 0%, #e8dcc0 40%, #d4c4a0 100%);
      box-shadow: 
        0 0 40px rgba(212, 168, 67, 0.4),
        0 0 80px rgba(212, 168, 67, 0.2),
        inset -5px -5px 20px rgba(0,0,0,0.1);
      pointer-events: none;
      z-index: 1;
      animation: moonGlow 4s ease-in-out infinite alternate;
    }
    @keyframes moonGlow {
      0% { box-shadow: 0 0 40px rgba(212, 168, 67, 0.4), 0 0 80px rgba(212, 168, 67, 0.2), inset -5px -5px 20px rgba(0,0,0,0.1); }
      100% { box-shadow: 0 0 60px rgba(212, 168, 67, 0.6), 0 0 120px rgba(212, 168, 67, 0.3), inset -5px -5px 20px rgba(0,0,0,0.1); }
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image: 
        radial-gradient(1px 1px at 10% 20%, #fff, transparent),
        radial-gradient(1px 1px at 30% 40%, #fff, transparent),
        radial-gradient(1px 1px at 50% 15%, #fff, transparent),
        radial-gradient(1px 1px at 70% 30%, #fff, transparent),
        radial-gradient(1px 1px at 90% 25%, #fff, transparent),
        radial-gradient(1px 1px at 20% 60%, #fff, transparent),
        radial-gradient(1px 1px at 80% 50%, #fff, transparent),
        radial-gradient(1px 1px at 40% 70%, #fff, transparent),
        radial-gradient(1px 1px at 60% 80%, #fff, transparent),
        radial-gradient(1px 1px at 15% 85%, #fff, transparent);
      background-repeat: repeat;
      background-size: 400px 400px;
      opacity: 0.3;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; }
      100% { opacity: 0.5; }
    }
    .card {
      position: relative;
      z-index: 10;
      background: linear-gradient(145deg, rgba(26, 46, 26, 0.95), rgba(13, 26, 13, 0.98));
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 24px;
      padding: 2rem;
      width: 100%;
      max-width: 1000px;
      margin: 1rem auto;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(74, 107, 58, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 8px 32px rgba(212, 168, 67, 0.4),
        0 0 0 2px rgba(212, 168, 67, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }
    .logo-icon svg { width: 36px; height: 36px; color: var(--forest-dark); }
    h1 { font-size: 2.2rem; font-weight: 400; letter-spacing: 0.05em; color: var(--cream); margin-bottom: 0.25rem; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    h2 { font-size: 1.4rem; font-weight: 400; color: var(--cream); margin-bottom: 1rem; }
    h3 { font-size: 1.1rem; font-weight: 500; color: var(--moss-light); margin-bottom: 0.75rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--moss-light); margin-bottom: 0.5rem; opacity: 0.8; }
    input, select, textarea {
      width: 100%;
      padding: 1rem 1.25rem;
      background: rgba(13, 26, 13, 0.8);
      border: 2px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      color: var(--cream);
      font-family: inherit;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      outline: none;
    }
    input::placeholder, textarea::placeholder { color: rgba(200, 220, 200, 0.4); }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.15), 0 0 20px rgba(212, 168, 67, 0.1);
      background: rgba(13, 26, 13, 0.95);
    }
    input:not(:placeholder-shown), select:not([value=""]) { border-color: var(--moss-light); }
    .btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
      background-size: 200% 100%;
      transition: background-position 0.4s ease;
    }
    .btn span { position: relative; z-index: 1; color: var(--forest-dark); }
    .btn:hover::before { background-position: 200% 0; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:disabled::before { background-position: 0 0; }
    .btn-secondary { background: var(--forest-light); color: var(--cream); }
    .btn-secondary::before { background: linear-gradient(90deg, var(--moss) 0%, var(--moss-light) 100%); }
    .btn-danger { background: var(--forest-light); color: #e87a6a; }
    .btn-danger::before { background: linear-gradient(90deg, #c85a4a 0%, #e87a6a 100%); }
    .error-message {
      display: none;
      text-align: center;
      padding: 0.875rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .error-message.show { display: block; }
    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--moss);
      opacity: 0.6;
    }
    .footer-note a { color: var(--gold-light); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }

    /* Calendar Styles */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(212, 168, 67, 0.15);
      border: 1px solid rgba(212, 168, 67, 0.3);
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--gold-light);
    }
    .user-badge .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .calendar-container { overflow-x: auto; }
    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .calendar-day-name {
      text-align: center;
      padding: 0.75rem 0;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--moss-light);
      opacity: 0.7;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .calendar-day {
      min-height: 100px;
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      padding: 0.5rem;
      position: relative;
      transition: all 0.2s ease;
    }
    .calendar-day:hover {
      background: rgba(13, 26, 13, 0.9);
      border-color: var(--gold);
    }
    .calendar-day.other-month { opacity: 0.3; }
    .calendar-day.today {
      border-color: var(--gold);
      box-shadow: inset 0 0 0 2px var(--gold);
    }
    .calendar-day.today::before {
      content: '';
      position: absolute;
      top: 4px; right: 4px;
      width: 8px; height: 8px;
      background: var(--gold);
      border-radius: 50%;
    }
    .day-number {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 0.5rem;
    }
    .calendar-day.other-month .day-number { color: var(--moss); }
    .reservations-list { display: flex; flex-direction: column; gap: 4px; }
    .reservation-chip {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: transform 0.15s ease;
      border: 1px solid transparent;
    }
    .reservation-chip:hover { transform: scale(1.02); z-index: 10; border-color: rgba(255,255,255,0.3); }
    .more-reservations {
      font-size: 0.65rem;
      color: var(--moss-light);
      text-align: center;
      padding: 2px;
      opacity: 0.7;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: linear-gradient(145deg, rgba(26, 46, 26, 0.98), rgba(13, 26, 13, 0.99));
      border: 1px solid rgba(74, 107, 58, 0.4);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-title { font-size: 1.5rem; color: var(--cream); }
    .modal-close {
      background: none; border: none; color: var(--moss-light); font-size: 1.5rem; cursor: pointer; padding: 0.5rem;
      opacity: 0.7; transition: opacity 0.2s;
    }
    .modal-close:hover { opacity: 1; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    textarea { min-height: 100px; resize: vertical; font-family: inherit; }

    .reservation-detail {
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1rem;
    }
    .reservation-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    .reservation-detail-title { font-size: 1.2rem; color: var(--cream); font-weight: 500; }
    .reservation-detail-meta { display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.9rem; color: var(--moss-light); }
    .reservation-detail-dates { display: flex; gap: 1rem; font-size: 0.85rem; }
    .reservation-actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
    .reservation-actions .btn { flex: 1; }

    .reservations-panel {
      background: rgba(13, 26, 13, 0.5);
      border: 1px solid rgba(74, 107, 58, 0.2);
      border-radius: 16px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .reservations-list-full { display: flex; flex-direction: column; gap: 0.75rem; }
    .reservation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: rgba(13, 26, 13, 0.6);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 10px;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .reservation-item-info { flex: 1; min-width: 200px; }
    .reservation-item-title { font-weight: 600; color: var(--cream); margin-bottom: 0.25rem; }
    .reservation-item-meta { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--moss-light); flex-wrap: wrap; }
    .reservation-item-actions { display: flex; gap: 0.5rem; }

    .color-legend { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(74, 107, 58, 0.2); }
    .color-legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--moss-light); }
    .color-legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    .sync-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(74, 107, 58, 0.15);
      border: 1px solid rgba(74, 107, 58, 0.3);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--moss-light);
    }
    .sync-indicator .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite;
    }
    .sync-indicator.syncing .dot { background: #f59e0b; animation: none; }
    .sync-indicator.error .dot { background: #ef4444; animation: none; }

    @media (max-width: 768px) {
      .card { padding: 1.5rem; margin: 0.5rem; border-radius: 16px; }
      h1 { font-size: 1.8rem; }
      .logo-icon { width: 64px; height: 64px; }
      .logo-icon svg { width: 32px; height: 32px; }
      .calendar-day { min-height: 80px; padding: 0.35rem; }
      .day-number { font-size: 1rem; }
      .form-row { grid-template-columns: 1fr; }
      .reservation-item { flex-direction: column; align-items: flex-start; }
      .reservation-item-actions { width: 100%; justify-content: flex-end; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="mountains" aria-hidden="true">
    <div class="mountain mountain-1"></div>
    <div class="mountain mountain-2"></div>
    <div class="mountain mountain-3"></div>
    <div class="mountain mountain-4"></div>
  </div>
  <div class="moon" aria-hidden="true"></div>

  <!-- LOGIN VIEW -->
  <main id="loginView" class="card" style="max-width: 420px; text-align: center;">
    <header class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h1>Montorlin</h1>
    </header>

    <div class="error-message" id="errorMsg" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="prenom">TON PRÉNOM</label>
        <input type="text" id="prenom" name="prenom" autocomplete="given-name" placeholder="Ton prénom" required aria-required="true">
      </div>
      <div class="form-group">
        <label for="password">MOT DE PASSE</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Celui de la famille" required aria-required="true">
      </div>
      <button type="submit" class="btn" id="submitBtn"><span>Entrer</span></button>
    </form>

    <p class="footer-note">Mot de passe partagé par toute la famille · Synchronisé via Supabase</p>
  </main>

  <!-- APP VIEW (hidden initially) -->
  <main id="appView" class="card" style="display: none; max-width: 1000px;">
    <header class="app-header">
      <div>
        <h1>Montorlin</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="sync-indicator" id="syncIndicator">
          <span class="dot"></span>
          <span id="syncText">Synchronisé</span>
        </div>
        <div class="user-badge">
          <span class="dot"></span>
          <span id="currentUser"></span>
        </div>
        <button class="btn btn-secondary" id="logoutBtn" style="padding: 0.75rem 1.5rem;"><span>Déconnexion</span></button>
      </div>
    </header>

    <div class="calendar-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 class="calendar-header-title" style="font-size: 1.3rem; color: var(--cream);"></h2>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-secondary" id="prevMonth" style="padding: 0.5rem 1rem;"><span>◀</span></button>
          <button class="btn btn-secondary" id="nextMonth" style="padding: 0.5rem 1rem;"><span>▶</span></button>
        </div>
      </div>
      <div class="calendar-header" id="calendarHeader"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="reservations-panel">
      <h3>Réservations à venir</h3>
      <div class="reservations-list-full" id="reservationsList"></div>
    </div>

    <div class="color-legend" id="colorLegend"></div>
  </main>

  <!-- MODAL FOR RESERVATION -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <header class="modal-header">
        <h2 class="modal-title" id="modalTitle">Nouvelle réservation</h2>
        <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
      </header>
      <form id="reservationForm">
        <input type="hidden" id="reservationId">
        <div class="form-group">
          <label for="resTitle">Titre</label>
          <input type="text" id="resTitle" placeholder="Ex: Week-end ski, Anniversaire Léa..." required maxlength="100">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="resStart">Arrivée</label>
            <input type="date" id="resStart" required>
          </div>
          <div class="form-group">
            <label for="resEnd">Départ</label>
            <input type="date" id="resEnd" required>
          </div>
        </div>
        <div class="form-group">
          <label for="resColor">Couleur</label>
          <select id="resColor">
            <option value="#e8c06a">🟡 Or</option>
            <option value="#6ab8e8">🔵 Bleu</option>
            <option value="#e87a6a">🔴 Rouge</option>
            <option value="#8ae8a0">🟢 Vert</option>
            <option value="#d88ae8">🟣 Violet</option>
            <option value="#e8b06a">🟠 Orange</option>
          </select>
        </div>
        <div class="form-group">
          <label for="resNotes">Notes</label>
          <textarea id="resNotes" placeholder="Détails, nombre de personnes, matériel..."></textarea>
        </div>
        <div class="reservation-actions">
          <button type="button" class="btn btn-danger" id="deleteReservationBtn" style="display: none;"><span>Supprimer</span></button>
          <button type="submit" class="btn"><span id="modalSubmitText">Créer</span></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase SDK (CDN) -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // Supabase config
    const SUPABASE_URL = 'https://acpriztsaogtmrsjvasz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Y4mVzZhMLQH-VhSHsaXetw_Epqx5rg7';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Shared family password
    const FAMILY_PASSWORD = "refuge2026";

    // Reservation colors
    const RESERVATION_COLORS = [
      { value: '#e8c06a', label: 'Or' },
      { value: '#6ab8e8', label: 'Bleu' },
      { value: '#e87a6a', label: 'Rouge' },
      { value: '#8ae8a0', label: 'Vert' },
      { value: '#d88ae8', label: 'Violet' },
      { value: '#e8b06a', label: 'Orange' }
    ];

    // State
    let currentUser = null;
    let currentMonth = new Date();
    let reservations = [];
    let familyMembers = [];

    // DOM Elements (will be set in init)
    let loginView, appView, loginForm, prenomInput, passwordInput, submitBtn, errorMsg;
    let logoutBtn, currentUserEl, syncText, calendarHeader, calendarGrid;
    let reservationsList, colorLegend, modalOverlay, modalClose, reservationForm;
    let reservationIdInput, resTitleInput, resStartInput, resEndInput, resColorSelect, resNotesInput;
    let deleteReservationBtn, modalSubmitText, modalOverlay, modalClose, modalTitle;
    let calendarHeader, calendarGrid, reservationsList, colorLegend;
    let resTitleInput, resStartInput, resEndInput, resColorSelect, resNotesInput;
    let deleteReservationBtn, modalSubmitText, modalClose, modalOverlay;
    let calendarHeaderEl, calendarGridEl, reservationsListEl, colorLegendEl;
    let resTitleInputEl, resStartInputEl, resEndInputEl, resColorSelectEl, resNotesInputEl;
    let deleteReservationBtnEl, modalSubmitTextEl, modalCloseEl, modalOverlayEl, modalTitleEl;
    let prevMonthBtn, nextMonthBtn;

    // Sync status
    function setSyncStatus(status, text) {
      const indicator = document.getElementById('syncIndicator');
      if (!indicator) return;
      indicator.classList.remove('syncing', 'error');
      if (status === 'syncing') indicator.classList.add('syncing');
      else if (status === 'error') indicator.classList.add('error');
      const textEl = document.getElementById('syncText');
      if (textEl) textEl.textContent = text || (status === 'ok' ? 'Synchronisé' : status === 'syncing' ? 'Synchronisation...' : 'Erreur');
    }

    // Initialize Supabase
    const SUPABASE_URL = 'https://acpriztsaogtmrsjvasz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Y4mVzZhMLQH-VhSHsaXetw_Epqx5rg7';
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Shared family password
    const FAMILY_PASSWORD = "refuge2026";

    // Helper: format date for input
    function formatDateForInput(date) {
      return date.toISOString().split('T')[0];
    }

    function formatDateFR(date) {
      return date.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getColorForUser(prenom) {
      const colors = RESERVATION_COLORS.map(c => c.value);
      let hash = 0;
      for (let i = 0; i < prenom.length; i++) hash = prenom.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    // CALENDAR FUNCTIONS
    function renderCalendarHeader() {
      const headerEl = document.getElementById('calendarHeader');
      if (!headerEl) return;
      const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
      headerEl.innerHTML = days.map(d => `<div class="calendar-day-name">${d}</div>`).join('');
    }

    function getMonthDays(year, month) {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDay = (firstDay.getDay() + 6) % 7;
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      const days = [];
      for (let i = startingDay - 1; i >= 0; i--) {
        days.push({ date: new Date(year, month - 1, prevMonthLastDay - i), otherMonth: true });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        days.push({ date: new Date(year, month, d), otherMonth: false });
      }
      const totalCells = Math.ceil((startingDay + daysInMonth) / 7) * 7;
      for (let d = 1; days.length < totalCells; d++) {
        days.push({ date: new Date(year, month + 1, d), otherMonth: true });
      }
      return days;
    }

    function getReservationsForDay(dateStr) {
      return reservations.filter(r => {
        const start = new Date(r.start_date);
        const end = new Date(r.end_date);
        const check = new Date(dateStr);
        return check >= start && check <= end;
      });
    }

    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
      
      const headerTitle = document.querySelector('.calendar-header-title');
      if (headerTitle) headerTitle.textContent = `${monthNames[month]} ${year}`;

      const days = getMonthDays(year, month);
      const gridEl = document.getElementById('calendarGrid');
      if (!gridEl) return;
      
      gridEl.innerHTML = days.map(day => {
        const dateStr = formatDateForInput(day.date);
        const dayReservations = getReservationsForDay(dateStr);
        const isToday = day.date.toDateString() === new Date().toDateString();
        const isOtherMonth = day.otherMonth;
        
        return `
          <div class="calendar-day ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}" data-date="${dateStr}">
            <div class="day-number">${day.date.getDate()}</div>
            <div class="reservations-list">
              ${dayReservations.slice(0, 4).map(r => `
                <div class="reservation-chip" style="background: ${r.color}; border-color: ${r.color};" data-id="${r.id}" title="${r.title} - ${r.prenom}${r.notes ? ': ' + r.notes : ''}">
                  ${r.title} (${r.prenom})
                </div>
              `).join('')}
              ${dayReservations.length > 4 ? `<div class="more-reservations">+${dayReservations.length - 4} autres</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.calendar-day:not(.other-month)').forEach(dayEl => {
        dayEl.addEventListener('click', (e) => {
          if (!e.target.closest('.reservation-chip')) {
            openModal(dayEl.dataset.date);
          }
        });
      });

      document.querySelectorAll('.reservation-chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          openModal(null, chip.dataset.id);
        });
      });
    }

    function updateMonth(delta) {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
      renderCalendar();
    }

    function renderReservationsList() {
      const upcoming = [...reservations]
        .filter(r => new Date(r.end_date) >= new Date())
        .sort((a, b) => new Date(a.start_date) - new Date(b.start_date))
        .slice(0, 10);

      const listEl = document.getElementById('reservationsList');
      if (!listEl) return;

      if (upcoming.length === 0) {
        listEl.innerHTML = '<p style="text-align: center; color: var(--moss); padding: 2rem;">Aucune réservation à venir. Cliquez sur un jour pour en créer une.</p>';
        return;
      }

      listEl.innerHTML = upcoming.map(r => `
        <div class="reservation-item" style="border-left: 4px solid ${r.color};">
          <div class="reservation-item-info">
            <div class="reservation-item-title">${r.title}</div>
            <div class="reservation-item-meta">
              <span>${formatDateFR(new Date(r.start_date))} → ${formatDateFR(new Date(r.end_date))}</span>
              <span>Par ${r.prenom}</span>
            </div>
          </div>
          <div class="reservation-item-actions">
            <button class="btn btn-secondary" onclick="openModal(null, '${r.id}')" style="padding: 0.5rem 1rem; font-size: 0.85rem;"><span>Modifier</span></button>
            <button class="btn btn-danger" onclick="deleteReservation('${r.id}')" style="padding: 0.5rem 1rem; font-size: 0.85rem;"><span>Supprimer</span></button>
          </div>
        </div>
      `).join('');
    }

    function formatDateFR(date) {
      return date.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function renderColorLegend() {
      const userColors = {};
      reservations.forEach(r => { userColors[r.prenom] = r.color; });
      
      const legendEl = document.getElementById('colorLegend');
      if (!legendEl) return;
      
      legendEl.innerHTML = Object.entries(userColors).map(([prenom, color]) => `
        <div class="color-legend-item">
          <span class="color-legend-dot" style="background: ${color};"></span>
          ${prenom}
        </div>
      `).join('');
    }

    // MODAL FUNCTIONS
    function openModal(dateStr = null, reservationId = null) {
      const modal = document.getElementById('modalOverlay');
      const isEdit = !!reservationId;
      
      const titleEl = document.getElementById('modalTitle');
      const submitTextEl = document.getElementById('modalSubmitText');
      const idInput = document.getElementById('reservationId');
      const titleInput = document.getElementById('resTitle');
      const startInput = document.getElementById('resStart');
      const endInput = document.getElementById('resEnd');
      const colorSelect = document.getElementById('resColor');
      const notesInput = document.getElementById('resNotes');
      const deleteBtn = document.getElementById('deleteReservationBtn');
      const submitTextEl2 = document.getElementById('modalSubmitText');
      
      if (isEdit) {
        const res = reservations.find(r => r.id === reservationId);
        if (!res) return;
        if (titleEl) titleEl.textContent = 'Modifier la réservation';
        if (submitTextEl2) submitTextEl2.textContent = 'Enregistrer';
        if (idInput) idInput.value = res.id;
        if (titleInput) titleInput.value = res.title;
        if (startInput) startInput.value = formatDateForInput(new Date(res.start_date));
        if (endInput) endInput.value = formatDateForInput(new Date(res.end_date));
        if (colorSelect) colorSelect.value = res.color;
        if (notesInput) notesInput.value = res.notes || '';
        if (deleteBtn) {
          deleteBtn.style.display = 'inline-flex';
          deleteBtn.onclick = () => deleteReservation(res.id);
        }
      } else {
        const titleEl2 = document.getElementById('modalTitle');
        const submitTextEl3 = document.getElementById('modalSubmitText');
        const idInput2 = document.getElementById('reservationId');
        const titleInput2 = document.getElementById('resTitle');
        const startInput2 = document.getElementById('resStart');
        const endInput2 = document.getElementById('resEnd');
        const colorSelect2 = document.getElementById('resColor');
        const notesInput2 = document.getElementById('resNotes');
        const deleteBtn2 = document.getElementById('deleteReservationBtn');
        
        if (titleEl2) titleEl2.textContent = 'Nouvelle réservation';
        if (submitTextEl3) submitTextEl3.textContent = 'Créer';
        if (idInput2) idInput2.value = '';
        if (titleInput2) titleInput2.value = '';
        if (startInput2) startInput2.value = dateStr || formatDateForInput(new Date());
        if (endInput2) endInput2.value = dateStr || formatDateForInput(new Date());
        if (colorSelect2) colorSelect2.value = getColorForUser(currentUser);
        if (notesInput2) notesInput2.value = '';
        if (deleteBtn2) deleteBtn2.style.display = 'none';
      }
      
      const modal = document.getElementById('modalOverlay');
      if (modal) modal.classList.add('open');
      setTimeout(() => {
        const titleInput3 = document.getElementById('resTitle');
        if (titleInput3) titleInput3.focus();
      }, 100);
    }

    function closeModal() {
      const modal = document.getElementById('modalOverlay');
      if (modal) modal.classList.remove('open');
      setTimeout(() => {
        const form = document.getElementById('reservationForm');
        if (form) form.reset();
        const idInput = document.getElementById('reservationId');
        if (idInput) idInput.value = '';
        const deleteBtn = document.getElementById('deleteReservationBtn');
        if (deleteBtn) deleteBtn.style.display = 'none';
      }, 300);
    }

    function formatDateForInput(date) {
      if (typeof date === 'string') return date;
      return date.toISOString().split('T')[0];
    }

    // RESERVATION CRUD
    async function loadReservations() {
      setSyncStatus('syncing', 'Chargement...');
      try {
        const { data, error } = await supabaseClient
          .from('reservations')
          .select('*')
          .order('start_date', { ascending: true });
        
        if (error) throw error;
        
        reservations = data || [];
        renderCalendar();
        renderReservationsList();
        renderColorLegend();
        setSyncStatus('ok', 'Synchronisé');
      } catch (error) {
        console.error('Load reservations error:', error);
        setSyncStatus('error', 'Erreur chargement');
      }
    }

    async function saveReservation(e) {
      e.preventDefault();
      
      const idInput = document.getElementById('reservationId');
      const titleInput = document.getElementById('resTitle');
      const startInput = document.getElementById('resStart');
      const endInput = document.getElementById('resEnd');
      const colorSelect = document.getElementById('resColor');
      const notesInput = document.getElementById('resNotes');
      const errorMsg = document.getElementById('errorMsg');
      const submitTextEl = document.getElementById('modalSubmitText');
      
      const isEdit = !!idInput?.value;
      const title = titleInput?.value?.trim();
      const start = startInput?.value;
      const end = endInput?.value;
      const color = colorSelect?.value;
      const notes = notesInput?.value?.trim();
      
      if (!title || !start || !end) {
        showError('Titre, arrivée et départ requis.');
        return;
      }
      if (new Date(end) < new Date(start)) {
        showError('La date de départ doit être après l\'arrivée.');
        return;
      }

      const reservationData = {
        title,
        start_date: start,
        end_date: end,
        color,
        notes,
        prenom: currentUser,
        updated_at: new Date().toISOString()
      };

      try {
        setSyncStatus('syncing', isEdit ? 'Mise à jour...' : 'Création...');
        
        if (isEdit) {
          const { error } = await supabaseClient
            .from('reservations')
            .update(reservationData)
            .eq('id', document.getElementById('reservationId')?.value);
          if (error) throw error;
        } else {
          const { error } = await supabaseClient
            .from('reservations')
            .insert(reservationData);
          if (error) throw error;
        }
        
        closeModal();
        await loadReservations();
        setSyncStatus('ok', 'Synchronisé');
      } catch (error) {
        console.error('Save reservation error:', error);
        showError('Erreur lors de la sauvegarde: ' + error.message);
        setSyncStatus('error', 'Erreur');
      }
    }

    async function deleteReservation(id) {
      if (!confirm('Supprimer cette réservation ?')) return;
      
      try {
        setSyncStatus('syncing', 'Suppression...');
        const { error } = await supabaseClient
          .from('reservations')
          .delete()
          .eq('id', id);
        if (error) throw error;
        
        closeModal();
        await loadReservations();
        setSyncStatus('ok', 'Synchronisé');
      } catch (error) {
        console.error('Delete error:', error);
        showError('Erreur suppression: ' + error.message);
        setSyncStatus('error', 'Erreur');
      }
    }

    function showError(message) {
      const errorMsg = document.getElementById('errorMsg');
      const prenomInput = document.getElementById('prenom');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      
      if (errorMsg) {
        errorMsg.textContent = message;
        errorMsg.classList.add('show');
      }
      if (prenomInput) prenomInput.style.borderColor = 'rgba(239, 68, 68, 0.5)';
      if (passwordInput) passwordInput.style.borderColor = 'rgba(239, 68, 68, 0.5)';
      setTimeout(() => {
        if (prenomInput) prenomInput.style.borderColor = '';
        if (passwordInput) passwordInput.style.borderColor = '';
      }, 3000);
    }

    function resetButton() {
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) {
        submitBtn.disabled = false;
        const span = submitBtn.querySelector('span');
        if (span) span.textContent = 'Entrer';
        submitBtn.style.background = '';
      }
    }

    function showApp(prenom) {
      const loginView = document.getElementById('loginView');
      const appView = document.getElementById('appView');
      const currentUserEl = document.getElementById('currentUser');
      
      if (loginView) loginView.style.display = 'none';
      if (appView) appView.style.display = 'block';
      currentUser = prenom;
      if (currentUserEl) currentUserEl.textContent = prenom;
      localStorage.setItem('montorlin-user', JSON.stringify({ prenom, loginTime: Date.now() }));
      
      loadFamilyMembers();
      loadReservations();
      renderCalendarHeader();
    }

    async function loadFamilyMembers() {
      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('prenom')
          .order('prenom');
        if (!error && data) {
          familyMembers = data.map(u => u.prenom);
        }
      } catch (e) { console.warn('Could not load family members:', e); }
    }

    function setSyncStatus(status, text) {
      const indicator = document.getElementById('syncIndicator');
      if (!indicator) return;
      indicator.classList.remove('syncing', 'error');
      if (status === 'syncing') indicator.classList.add('syncing');
      else if (status === 'error') indicator.classList.add('error');
      const textEl = document.getElementById('syncText');
      if (textEl) textEl.textContent = text || (status === 'ok' ? 'Synchronisé' : status === 'syncing' ? 'Synchronisation...' : 'Erreur');
    }

    // INITIALIZATION - runs when DOM is ready
    function init() {
      // Cache DOM elements
      loginView = document.getElementById('loginView');
      appView = document.getElementById('appView');
      loginForm = document.getElementById('loginForm');
      prenomInput = document.getElementById('prenom');
      passwordInput = document.getElementById('password');
      submitBtn = document.getElementById('submitBtn');
      errorMsg = document.getElementById('errorMsg');
      logoutBtn = document.getElementById('logoutBtn');
      currentUserEl = document.getElementById('currentUser');
      syncText = document.getElementById('syncText');
      calendarHeaderEl = document.getElementById('calendarHeader');
      calendarGridEl = document.getElementById('calendarGrid');
      reservationsListEl = document.getElementById('reservationsList');
      colorLegendEl = document.getElementById('colorLegend');
      modalOverlay = document.getElementById('modalOverlay');
      modalClose = document.getElementById('modalClose');
      reservationForm = document.getElementById('reservationForm');
      prevMonthBtn = document.getElementById('prevMonth');
      nextMonthBtn = document.getElementById('nextMonth');
      
      // Modal elements
      modalOverlay = document.getElementById('modalOverlay');
      modalClose = document.getElementById('modalClose');
      reservationForm = document.getElementById('reservationForm');
      
      // Verify critical elements exist
      if (!loginForm || !prenomInput || !passwordInput || !submitBtn || !loginView || !appView) {
        console.error('Critical DOM elements missing!');
        return;
      }

      // Calendar header
      renderCalendarHeader();
      
      // Check existing session
      const savedUser = localStorage.getItem('montorlin-user');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          showApp(user.prenom);
          return;
        } catch {
          localStorage.removeItem('montorlin-user');
        }
      }
      
      // Calendar navigation
      const prevBtn = document.getElementById('prevMonth');
      const nextBtn = document.getElementById('nextMonth');
      if (prevBtn) prevBtn.addEventListener('click', () => updateMonth(-1));
      if (nextBtn) nextBtn.addEventListener('click', () => updateMonth(1));
      
      // Calendar header
      renderCalendarHeader();
      
      // Calendar navigation
      if (prevMonthBtn) prevMonthBtn.addEventListener('click', () => updateMonth(-1));
      if (nextMonthBtn) nextMonthBtn.addEventListener('click', () => updateMonth(1));
    }

    // Handle DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // EVENT LISTENERS (defined after init but use getElementById at call time)
    function setupEventListeners() {
      // Login form
      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const prenomInput = document.getElementById('prenom');
          const passwordInput = document.getElementById('password');
          const submitBtn = document.getElementById('submitBtn');
          const errorMsg = document.getElementById('errorMsg');
          
          const prenom = prenomInput?.value?.trim();
          const password = passwordInput?.value;

          if (errorMsg) errorMsg.classList.remove('show');
          if (submitBtn) {
            submitBtn.disabled = true;
            const span = submitBtn.querySelector('span');
            if (span) span.textContent = 'Connexion...';
          }

          await new Promise(r => setTimeout(r, 600));

          if (password !== FAMILY_PASSWORD) {
            showError("Ce n'est pas le bon mot de passe familial.");
            resetButton();
            return;
          }

          if (!prenom) {
            showError("Entre ton prénom.");
            resetButton();
            return;
          }

          // Save to Supabase
          try {
            setSyncStatus('syncing', 'Connexion...');
            await supabaseClient
              .from('users')
              .upsert({ prenom: document.getElementById('prenom')?.value?.trim(), last_seen: new Date().toISOString(), online: true }, { onConflict: 'prenom' });
            setSyncStatus('ok');
          } catch (e) { console.warn('User upsert failed:', e); }

          localStorage.setItem('montorlin-user', JSON.stringify({ prenom: document.getElementById('prenom')?.value?.trim(), loginTime: Date.now() }));
          
          const submitBtn2 = document.getElementById('submitBtn');
          if (submitBtn2) {
            const span2 = submitBtn2.querySelector('span');
            if (span2) span2.textContent = 'Bienvenue...';
            submitBtn2.style.background = 'linear-gradient(90deg, #22c55e, #4ade80)';
          }
          
          setTimeout(() => showApp(document.getElementById('prenom')?.value?.trim()), 800);
        });
      }

      // Logout
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('montorlin-user');
          currentUser = null;
          reservations = [];
          const loginView = document.getElementById('loginView');
          const appView = document.getElementById('appView');
          if (loginView) loginView.style.display = 'block';
          if (appView) appView.style.display = 'none';
          const prenomInput2 = document.getElementById('prenom');
          const passwordInput2 = document.getElementById('password');
          if (prenomInput2) prenomInput2.value = '';
          if (passwordInput2) passwordInput2.value = '';
          if (prenomInput2) prenomInput2.focus();
        });
      }

      // Modal
      const modalClose = document.getElementById('modalClose');
      const modalOverlay = document.getElementById('modalOverlay');
      if (modalClose) modalClose.addEventListener('click', closeModal);
      if (modalOverlay) modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

      // Reservation form
      const reservationForm = document.getElementById('reservationForm');
      if (reservationForm) reservationForm.addEventListener('submit', saveReservation);

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        const appView = document.getElementById('appView');
        if (appView?.style.display === 'none') return;
        if (e.key === 'ArrowLeft') { updateMonth(-1); }
        else if (e.key === 'ArrowRight') { updateMonth(1); }
        else if (e.key === 'Escape') { closeModal(); }
      });
    }

    // Run init when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        init();
        setupEventListeners();
      });
    } else {
      init();
      setupEventListeners();
    }

    // Also handle calendar nav from header buttons
    document.addEventListener('click', (e) => {
      if (e.target.id === 'prevMonth') updateMonth(-1);
      else if (e.target.id === 'nextMonth') updateMonth(1);
    });
  </script>
